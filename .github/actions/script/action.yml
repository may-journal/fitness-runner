name: Run a repo script
description: >-
  Run one script from this repo's scripts folder, with the environment of the
  step that calls it. Reusable workflows use it, since their callers' checkouts
  do not hold the script.
inputs:
  script:
    description: The script's file name under scripts/, such as auto-merge.sh.
    required: true
outputs:
  edited:
    description: Set to true by a script that edited the release PR.
    value: ${{ steps.run.outputs.edited }}
  releases:
    description: The JSON array of releases a script moved tags for.
    value: ${{ steps.run.outputs.releases }}
  ready:
    description: Set to true by a script that checked the approver token.
    value: ${{ steps.run.outputs.ready }}
  login:
    description: The approver token's login.
    value: ${{ steps.run.outputs.login }}
  sha:
    description: The commit a script checked.
    value: ${{ steps.run.outputs.sha }}
  file:
    description: The file a script found, such as a Go module or JDK version file.
    value: ${{ steps.run.outputs.file }}
  green:
    description: Set to true by a script that found every check green.
    value: ${{ steps.run.outputs.green }}
runs:
  using: composite
  steps:
    - name: Run the script
      id: run
      shell: bash
      env:
        SCRIPT: ${{ inputs.script }}
      run: '"${{ github.action_path }}/../../../scripts/$SCRIPT"'
