name: Install Fitness
description: >-
  Put fitness and every check on PATH: the pinned bundle, or a build of an
  explicitly requested source ref.
inputs:
  ref:
    description: Optional source ref to compile; empty installs the pinned bundle.
    required: false
    default: ''
  with-checks:
    description: >-
      Also install the checks .fitnessrc.json pins, each from its own release,
      and set FITNESS_CHECKS_DIR: true for every pinned or default check,
      pinned only where checkVersions is set, false for none.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # A hosted runner starts empty, so each check archive downloads once per
    # pin set; a self-hosted runner keeps its cache folder on disk.
    - name: Restore the installed checks
      if: ${{ inputs.ref == '' && inputs.with-checks != 'false' && runner.environment == 'github-hosted' && hashFiles('.fitnessrc.json') != '' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/fitness/checks
        key: fitness-checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.fitnessrc.json') }}
    - name: Install the pinned fitness bundle
      if: ${{ inputs.ref == '' }}
      uses: may-journal/fitness-runner@v1
      with:
        install-only: 'true'
        with-checks: ${{ inputs.with-checks }}
    # A source build keeps the newest stable Go it needs.
    - name: Set up Go for the source build
      if: ${{ inputs.ref != '' }}
      uses: actions/setup-go@v5
      with:
        go-version: stable
        # No go.sum exists to key on, so the cache would only log a warning.
        cache: false
    - name: Build an explicitly requested source ref
      if: ${{ inputs.ref != '' }}
      shell: bash
      env:
        GOPROXY: direct
        FITNESS_SOURCE_REF: ${{ inputs.ref }}
      run: |
        go install "github.com/may-journal/fitness-runner/go/cmd/...@$FITNESS_SOURCE_REF"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    # The engine built from source holds no check, so the checks the repo
    # pins install from the repo's own root.
    - name: Install the pinned checks for the source build
      if: ${{ inputs.ref != '' && inputs.with-checks == 'true' }}
      shell: bash
      run: checks="$("$(go env GOPATH)/bin/fitness-install" --version latest --with-checks --install-only | sed -n 2p)" && test -n "$checks" && echo "FITNESS_CHECKS_DIR=$checks" >> "$GITHUB_ENV"
