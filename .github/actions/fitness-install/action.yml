name: Install Fitness
description: >-
  Put fitness and every check on PATH: the pinned bundle, or a build of an
  explicitly requested source ref.
inputs:
  ref:
    description: Optional source ref to compile; empty installs the pinned bundle.
    required: false
    default: ''
  with-checks:
    description: >-
      Also install the checks .fitnessrc.json pins, each from its own release,
      and set FITNESS_CHECKS_DIR: true for every pinned or default check,
      pinned only where checkVersions is set, false for none. on-demand
      installs none up front, and the engine fetches each check it runs.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # A hosted runner starts empty, so the checks cache keys on the release
    # index, which names every check version a release holds.
    - name: Hash the release index
      id: index
      if: ${{ inputs.ref == '' && inputs.with-checks != 'false' && runner.environment == 'github-hosted' }}
      shell: bash
      run: if hash="$(curl -fsSL --retry 3 https://github.com/may-journal/fitness-checks/releases/download/fitness-check-index/index.json | shasum -a 256)"; then printf 'hash=%.64s\n' "$hash" >> "$GITHUB_OUTPUT"; else printf '::warning::Could not read the release index, so the checks cache is not restored.\n'; fi
    - name: Restore the installed checks
      if: ${{ steps.index.outputs.hash != '' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/fitness/checks
        # Each job keeps its own set, so an on-demand job saves what it fetched.
        key: fitness-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.index.outputs.hash }}-${{ github.job }}
        restore-keys: |
          fitness-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.index.outputs.hash }}-
          fitness-checks-${{ runner.os }}-${{ runner.arch }}-
    - name: Install the pinned fitness bundle
      if: ${{ inputs.ref == '' }}
      uses: may-journal/fitness-runner@v1
      with:
        install-only: 'true'
        with-checks: ${{ inputs.with-checks == 'on-demand' && 'false' || inputs.with-checks }}
    # A source build keeps the newest stable Go it needs.
    - name: Set up Go for the source build
      if: ${{ inputs.ref != '' }}
      uses: actions/setup-go@v5
      with:
        go-version: stable
        # No go.sum exists to key on, so the cache would only log a warning.
        cache: false
    - name: Build an explicitly requested source ref
      if: ${{ inputs.ref != '' }}
      shell: bash
      env:
        GOPROXY: direct
        GH_TOKEN: ${{ github.token }}
        FITNESS_SOURCE_REF: ${{ inputs.ref }}
        FITNESS_INSTALL_ACTION: ${{ github.action_path }}
      run: |
        "$FITNESS_INSTALL_ACTION/install-source.sh" "$FITNESS_SOURCE_REF"
    # The engine built from source holds no check, so the checks the repo pins
    # install from its root, in the mode with-checks names. A failed install
    # fails the step; a pinned-only repo with no pins installs none.
    - name: Install the pinned checks for the source build
      if: ${{ inputs.ref != '' && inputs.with-checks != 'false' && inputs.with-checks != 'on-demand' }}
      shell: bash
      env:
        FITNESS_WITH_CHECKS: ${{ inputs.with-checks }}
        # The release lookup counts against the run's own limit, not the
        # runner address's shared one.
        GH_TOKEN: ${{ github.token }}
      run: checks="$("$(go env GOPATH)/bin/fitness-install" --version latest --install-only | sed -n 2p)" && { [ -z "$checks" ] || echo "FITNESS_CHECKS_DIR=$checks" >> "$GITHUB_ENV"; }
