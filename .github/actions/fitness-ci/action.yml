name: Run fitness-ci
description: >-
  Run one fitness-ci subcommand with the environment of the step that calls
  it. fitness-ci ships in the fitness bundle, so a job that installed fitness
  already has it; any other job installs the bundle first, and needs no Go.
inputs:
  command:
    description: The subcommand and its arguments, such as auto-merge.
    required: true
outputs:
  edited:
    description: Set to true by a subcommand that edited the release PR.
    value: ${{ steps.run.outputs.edited }}
  releases:
    description: The JSON array of releases a subcommand moved tags for.
    value: ${{ steps.run.outputs.releases }}
  ready:
    description: Set to true by a subcommand that checked the approver token.
    value: ${{ steps.run.outputs.ready }}
  login:
    description: The approver token's login.
    value: ${{ steps.run.outputs.login }}
  sha:
    description: The commit a subcommand checked.
    value: ${{ steps.run.outputs.sha }}
  file:
    description: The file a subcommand found, such as a Go module or JDK version file.
    value: ${{ steps.run.outputs.file }}
  green:
    description: Set to true by a subcommand that found every check green.
    value: ${{ steps.run.outputs.green }}
  base:
    description: The prefix of any checks set.
    value: ${{ steps.run.outputs.base }}
  index:
    description: The prefix of this release index's checks sets.
    value: ${{ steps.run.outputs.index }}
  job:
    description: The prefix of this job's checks sets.
    value: ${{ steps.run.outputs.job }}
  key:
    description: The key a checks set saves under.
    value: ${{ steps.run.outputs.key }}
runs:
  using: composite
  steps:
    # The caller's own step condition decides whether this action runs, so
    # its steps run whenever it does.
    - name: Find fitness-ci
      id: find
      if: ${{ always() }}
      continue-on-error: true
      shell: bash
      run: command -v fitness-ci
    - name: Install the fitness bundle, which holds fitness-ci
      id: bundle
      if: ${{ always() && steps.find.outcome == 'failure' }}
      uses: may-journal/fitness-runner@v1
      with:
        install-only: 'true'
    - name: Find fitness-ci in the bundle
      id: found
      if: ${{ always() && steps.find.outcome == 'failure' }}
      continue-on-error: true
      shell: bash
      run: command -v fitness-ci
    # A bundle released before fitness-ci lacks it, so until one holds it,
    # this action builds it from its own checkout.
    - name: Set up Go for a bundle without fitness-ci
      id: go
      if: ${{ always() && steps.found.outcome == 'failure' }}
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/../../../go/go.mod
        # No go.sum exists to key on, so the cache would only log a warning.
        cache: false
    - name: Build fitness-ci
      id: build
      if: ${{ always() && steps.go.outcome == 'success' }}
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: make fitness-ci
    - name: Put the built fitness-ci on PATH
      if: ${{ always() && steps.build.outcome == 'success' }}
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: echo "$PWD/bin" >> "$GITHUB_PATH"
    # The command is one argument, which fitness-ci splits into words, so
    # bash never expands a glob in it.
    - name: Run the subcommand
      id: run
      if: ${{ always() }}
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
      run: fitness-ci "$COMMAND"
