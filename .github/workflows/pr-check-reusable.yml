name: PR check (reusable)

# Org repos call this from a thin caller to judge PR descriptions with the
# published checks. fitness-runner keeps its own build-from-source pr-check to
# test unreleased changes.
on:
  # workflow_call: a repo adds a thin caller. pull_request: the org ruleset
  # injects this file directly as a required workflow (which needs a
  # pull_request trigger, not workflow_call).
  workflow_call:
    inputs:
      ref:
        description: Optional source ref to compile; empty uses the pinned binary release.
        type: string
        default: ''
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-check:
    # fitness-runner and the ruleset's injected run skip here, since the first
    # builds its own pr-check and the Fitness suite job already runs it.
    if: github.repository != 'may-journal/fitness-runner' && github.workflow != 'PR check (reusable)'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    # Pushes and edits come in bursts; only the newest PR state needs a check.
    # The workflow name keeps a caller's run and the ruleset's apart.
    concurrency:
      group: pr-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR description(s) and fail the run on violations
        uses: $/.github/actions/fitness-command
        with:
          command: pr-check
          ref: ${{ inputs.ref }}
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "${{ job.status }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
