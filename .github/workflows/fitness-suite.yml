name: Fitness suite

# Required in every org repo: the may-journal/.github ruleset
# rulesets/fitness-suite-workflow.json injects this file on each pull request.
# It runs ci-reusable, which installs swiftlint when the repo has Swift sources.
# The full `uses:` path matters: an injected workflow resolves `./` in the
# target repo. Only fitness-runner skips the job, since its own CI builds the
# checks from source. The skip is a job condition rather than a separate job,
# because GitHub bills every job at least one minute.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  org-fitness:
    if: github.repository != 'may-journal/fitness-runner'
    uses: may-journal/fitness-runner/.github/workflows/ci-reusable.yml@v1
