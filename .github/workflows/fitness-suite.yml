name: Fitness suite

# The org ruleset injects this into every repo's pull requests, running
# ci-reusable and pr-check in one job by its full `uses:` path. An edit reruns
# the whole suite, since a skipped suite would turn an earlier failure green.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  org-fitness:
    if: github.repository != 'may-journal/fitness-runner'
    uses: may-journal/fitness-runner/.github/workflows/ci-reusable.yml@v1
    with:
      pr-check: true
