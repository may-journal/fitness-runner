name: Fitness suite

# Required in every org repo: the may-journal/.github ruleset
# rulesets/fitness-suite-workflow.json injects this file on each pull request.
# It runs ci-reusable, installing swiftlint when the repo has Swift sources.
# The full `uses:` path matters: an injected workflow resolves `./` in the
# target repo. Only fitness-runner skips the job, since its own
# CI builds the checks from source.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
      swift: ${{ steps.detect.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          run=true
          if [ "$GITHUB_REPOSITORY" = may-journal/fitness-runner ]; then
            run=false
          fi
          swift=false
          if git ls-files '*.swift' | grep -q .; then swift=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "swift=$swift" >> "$GITHUB_OUTPUT"
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
          REPORT_ALREADY_ANNOTATED: ${{ env.FITNESS_FAILURE_REPORTED == 'true' && (false) }}
        run: |
          if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  org-fitness:
    needs: detect
    if: needs.detect.outputs.run == 'true'
    uses: may-journal/fitness-runner/.github/workflows/ci-reusable.yml@main
    with:
      swift: ${{ needs.detect.outputs.swift == 'true' }}
