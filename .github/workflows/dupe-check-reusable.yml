name: Dupe check (reusable)

# Reusable across the org: a consumer repo calls this from an `issues` caller
# with a manual sweep. It installs the published fitness checks and runs
# `fitness dupe-check`, which keeps one note on a new issue listing the older
# issues it resembles, and on a manual run prints every pair's score and
# writes nothing. Its checkout supplies the repo's `.fitnessrc.json` scores.
# fitness-runner keeps its own build-from-source dupe-check to test unreleased
# changes.
on:
  workflow_call:
    inputs:
      ref:
        description: Optional source ref to compile; empty uses the pinned binary release.
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  dupe-check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    # Runs for one Issue queue, so an edit never cancels the opened run,
    # the only one that can close the Issue as a duplicate.
    concurrency:
      group: dupe-check-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: ${{ inputs.ref != '' }}
        with:
          go-version: stable
          cache: false
      - name: Install the pinned fitness bundle
        id: report-step-1
        if: ${{ inputs.ref == '' }}
        uses: may-journal/fitness-runner@v1
        with:
          install-only: 'true'
      - name: Build an explicitly requested source ref
        if: ${{ inputs.ref != '' }}
        env:
          GOPROXY: direct
          FITNESS_SOURCE_REF: ${{ inputs.ref }}
        run: |
          go install "github.com/may-journal/fitness-runner/go/cmd/...@$FITNESS_SOURCE_REF"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Note older issues this one resembles, or sweep every pair
        id: report-step-2
        run: fitness dupe-check
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain complete Fitness reports
        id: fitness-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fitness-reports-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}-${{ env.FITNESS_REPORT_ID }}
          path: ${{ runner.temp }}/fitness-reports/
          if-no-files-found: ignore
          retention-days: 7
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
          REPORT_ARTIFACT_URL: ${{ steps.fitness-reports.outputs.artifact-url }}
          REPORT_ALREADY_ANNOTATED: ${{ steps.fitness-reports.outcome != 'failure' && env.FITNESS_FAILURE_REPORTED == 'true' && (steps.report-step-1.outcome == 'failure' || steps.report-step-2.outcome == 'failure') }}
        run: |
          if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPORT_ARTIFACT_URL" ]; then
            printf '\n[Download complete Fitness reports](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
