name: Dupe check (reusable)

# This runs the published `fitness dupe-check` for a manual sweep, printing every
# issue pair's score and writing nothing. Issue events get dupe-check from
# issue-check-reusable, and this file stays until no repo carries its caller.
on:
  workflow_call:
    inputs:
      ref:
        description: Optional source ref to compile; empty uses the pinned binary release.
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  dupe-check:
    # A skipped job starts no runner, so an issue event bills nothing here.
    if: github.event_name == 'workflow_dispatch'
    # A private repo's manual sweep runs in the self-hosted fitness group, which bills no minutes.
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"fitness","labels":"fitness"}') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 5
    # One queue per Issue keeps an edit from cancelling the opened run, which
    # alone can close the Issue as a duplicate.
    concurrency:
      group: dupe-check-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Note older issues this one resembles, or sweep every pair
        uses: $/.github/actions/fitness-command
        with:
          command: dupe-check
          ref: ${{ inputs.ref }}
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "${{ job.status }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
