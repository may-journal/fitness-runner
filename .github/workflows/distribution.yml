# cspell:ignore goreleaser
name: Binary distribution
on:
  pull_request:
  # A push to main saves the bundle and smoke Go build caches that pull
  # requests restore. Only a change those caches hold starts it.
  push:
    branches: [main]
    paths:
      - 'go/**'
      - 'skills/**'
      - '.goreleaser-*.yml'
      - .github/actions/setup-go-cache/**
      - .github/workflows/distribution.yml
  workflow_call:
# A newer main push supersedes an older one, since only the newest cache
# matters. Pull request and release runs get their own group, so none wait.
concurrency:
  group: distribution-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go-cache
        with:
          cache-key: bundle
          save: true
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: v2.18.2
          install-only: true
      - name: Build and package with GoReleaser
        id: report-step-1
        env:
          SNAPSHOT: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          export FITNESS_VERSION="$(go -C go run ./cmd/fitness-release version --root ..)"
          args=()
          if [ "$SNAPSHOT" = true ]; then args+=(--snapshot); fi
          goreleaser release --clean --skip=publish "${args[@]}" --config .goreleaser-bundles.yml
          export FITNESS_BUNDLE_HASHES="$(go -C go run ./cmd/fitness-release bundle-hashes --root ..)"
          goreleaser release --clean --skip=publish "${args[@]}" --config .goreleaser-tools.yml
          go -C go run ./cmd/fitness-release assemble --root ..
      - uses: actions/upload-artifact@v4
        with:
          name: fitness-release
          path: |
            out/fitness-*.tar.gz
            out/fitness-install-*
            out/fitness-release-*
            out/checksums.txt
            out/release.json
          retention-days: 3
          compression-level: 0
      - name: Retain complete Fitness reports
        id: fitness-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fitness-reports-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}-${{ env.FITNESS_REPORT_ID }}
          path: ${{ runner.temp }}/fitness-reports/
          if-no-files-found: ignore
          retention-days: 7
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
          REPORT_ARTIFACT_URL: ${{ steps.fitness-reports.outputs.artifact-url }}
          REPORT_ALREADY_ANNOTATED: ${{ steps.fitness-reports.outcome != 'failure' && env.FITNESS_FAILURE_REPORTED == 'true' && (steps.report-step-1.outcome == 'failure') }}
        run: |
          if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPORT_ARTIFACT_URL" ]; then
            printf '\n[Download complete Fitness reports](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

  smoke:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's smoke run judges only the files it changes, which
          # needs the base branch to diff against.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: fitness-release
          path: out
      - name: Run the Go release verifier
        id: report-step-1
        env:
          VERIFIER: out/fitness-release-${{ matrix.platform }}
          FITNESS_CACHE_DIR: ${{ runner.temp }}/fitness-native-cache
        run: |
          chmod +x "$VERIFIER"
          "$VERIFIER" smoke
      # Release builds run this job too; see docs/ci.md#performance-record.
      - name: Record binary sizes and install time
        # The record only measures; a failed timing never blocks a release,
        # and only a finished record reaches the artifact.
        continue-on-error: true
        env:
          VERIFIER: out/fitness-release-${{ matrix.platform }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/fitness-performance"
          "$VERIFIER" record > "$RUNNER_TEMP/release-$PLATFORM.json"
          mv "$RUNNER_TEMP/release-$PLATFORM.json" "$RUNNER_TEMP/fitness-performance/"
      - name: Retain the performance record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fitness-performance-${{ github.job }}-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fitness-performance/
          if-no-files-found: ignore
          retention-days: 90
      - uses: ./.github/actions/setup-go-cache
        with:
          cache-key: smoke
          save: true
      - name: Run the full suite with the candidate Go installer
        id: report-step-2
        env:
          FITNESS_CACHE_DIR: ${{ runner.temp }}/fitness-native-cache
        run: |
          chmod +x out/fitness-install-*-${{ matrix.platform }}
          out/fitness-install-*-${{ matrix.platform }} -- --policy=external
      - name: Retain complete Fitness reports
        id: fitness-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fitness-reports-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}-${{ env.FITNESS_REPORT_ID }}
          path: ${{ runner.temp }}/fitness-reports/
          if-no-files-found: ignore
          retention-days: 7
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
          REPORT_ARTIFACT_URL: ${{ steps.fitness-reports.outputs.artifact-url }}
          REPORT_ALREADY_ANNOTATED: ${{ steps.fitness-reports.outcome != 'failure' && env.FITNESS_FAILURE_REPORTED == 'true' && (steps.report-step-1.outcome == 'failure' || steps.report-step-2.outcome == 'failure') }}
        run: |
          if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPORT_ARTIFACT_URL" ]; then
            printf '\n[Download complete Fitness reports](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The requirement tests take about 157 s on one runner, so each platform
  # splits them over two jobs that run beside smoke.
  requirements:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-amd64, linux-arm64]
        shard: [1, 2]
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: fitness-release
          path: out
      - name: Seed the cache with the Go release verifier
        id: report-step-1
        env:
          VERIFIER: out/fitness-release-${{ matrix.platform }}
          FITNESS_CACHE_DIR: ${{ runner.temp }}/fitness-native-cache
        run: |
          chmod +x "$VERIFIER"
          "$VERIFIER" smoke
      # Smoke no longer builds the requirement tests, so they keep their own
      # cache; one shard saves it.
      - uses: ./.github/actions/setup-go-cache
        with:
          cache-key: requirements
          save: ${{ matrix.shard == 1 }}
      - name: Run one shard of the requirement tests with the candidate Go installer
        id: report-step-2
        env:
          FITNESS_CACHE_DIR: ${{ runner.temp }}/fitness-native-cache
        run: |
          chmod +x out/fitness-install-*-${{ matrix.platform }}
          export FITNESS_INSTALL="$(ls "$PWD"/out/fitness-install-*-${{ matrix.platform }})"
          sh tests/requirements-shard.sh ${{ matrix.shard }} 2
      - name: Retain complete Fitness reports
        id: fitness-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fitness-reports-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}-${{ env.FITNESS_REPORT_ID }}
          path: ${{ runner.temp }}/fitness-reports/
          if-no-files-found: ignore
          retention-days: 7
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
          REPORT_ARTIFACT_URL: ${{ steps.fitness-reports.outputs.artifact-url }}
          REPORT_ALREADY_ANNOTATED: ${{ steps.fitness-reports.outcome != 'failure' && env.FITNESS_FAILURE_REPORTED == 'true' && (steps.report-step-1.outcome == 'failure' || steps.report-step-2.outcome == 'failure') }}
        run: |
          if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPORT_ARTIFACT_URL" ]; then
            printf '\n[Download complete Fitness reports](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
