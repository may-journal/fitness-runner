name: Binary distribution
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: cd go && go test ./internal/distribution
      - run: .github/scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fitness-release
          path: out/
          retention-days: 3
  smoke:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fitness-release
          path: out
      - run: .github/scripts/smoke-release.sh
        env:
          FITNESS_CACHE_DIR: ${{ runner.temp }}/fitness-native-cache
          FITNESS_TEST_TOOL_PATH: ${{ runner.temp }}/fitness-native-tools
      - name: Bind the action to the staged release
        run: cp out/fitness.sh fitness.sh
      - name: Run the root action without Go
        uses: ./
        env:
          PATH: ${{ runner.temp }}/fitness-native-tools
          FITNESS_CACHE_DIR: ${{ runner.temp }}/fitness-native-cache
          FITNESS_TEST_RELEASE_DIR: ${{ github.workspace }}/out
        with:
          check: markdown-filename-kebab-case
