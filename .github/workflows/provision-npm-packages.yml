# Seeds new @mayjournal/* packages on npm and configures trusted publishing for publish.yml.
# Runs when workspace package.json files change so new check packages are provisioned without manual steps.
#
# Required repo secret: NPM_PROVISION_TOKEN
#   Granular access token with read/write on @mayjournal packages (automation / bypass 2FA if available).
#   Used only here; Publish continues to use OIDC trusted publishing (no long-lived publish token).
name: Provision npm packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**/package.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/provision-npm-packages/**'
      - 'scripts/list-publishable-packages/**'

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Use npm 11 for trust command
        run: npm install -g npm@11.14.1

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PROVISION_TOKEN }}

      - name: Provision registry + trusted publishers
        run: node scripts/provision-npm-packages/index.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PROVISION_TOKEN }}
