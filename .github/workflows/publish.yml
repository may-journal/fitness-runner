name: Publish

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_PROVISION_TOKEN || secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require npm publish token
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "Set repository secret NPM_TOKEN or NPM_PROVISION_TOKEN (granular npm write token for @mayjournal)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run publish:ci
