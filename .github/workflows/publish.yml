name: Publish

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Use npm 11 for OIDC publish
        run: npm install -g npm@11.14.1
      - run: npm ci
      - name: Provision new npm packages (registry + trusted publishers)
        run: node scripts/provision-npm-packages/index.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PROVISION_TOKEN }}
      - name: Verify all packages are ready for OIDC publish
        run: node scripts/provision-npm-packages/index.mjs check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PROVISION_TOKEN }}
      - run: npm run publish:ci
