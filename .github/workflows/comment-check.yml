name: Comment check

# This repo runs the reusable workflow it publishes, built from this commit, so
# the code under review judges each comment.
on:
  issue_comment:
    types: [created, edited]
  # A submitted review starts one job for all its comments, where a job per
  # new comment billed a minute each. An edit is still judged alone.
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # The called job's known-bot guard and per-comment concurrency apply here
  # too, so a bot's comment still starts no runner.
  comment-check:
    uses: ./.github/workflows/comment-check-reusable.yml
    with:
      # A review event's sha is a merge commit that go install cannot fetch, so
      # a pull request builds its head commit.
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
