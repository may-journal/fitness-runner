name: Release
on:
  push:
    tags: ['go/v*']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Verify the tag matches the newest CHANGELOG heading
        run: go run ./cmd/fitness-release verify-tag --root ..
        working-directory: go
  binaries:
    needs: verify
    uses: ./.github/workflows/distribution.yml
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fitness-release
          path: out
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x out/fitness-release-linux-amd64
          out/fitness-release-linux-amd64 publish
  verify-download:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
          - runner: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fitness-release
          path: out
      - name: Verify public downloads with the Go tool
        env:
          VERIFIER: out/fitness-release-${{ matrix.platform }}
          FITNESS_CACHE_DIR: ${{ runner.temp }}/fitness-public-cache
          FITNESS_TEST_TOOL_PATH: ${{ runner.temp }}/fitness-consumer-tools
        run: |
          chmod +x "$VERIFIER"
          "$VERIFIER" verify-download
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Run the full suite through the released action
        uses: ./
        with:
          policy: external
        env:
          FITNESS_CACHE_DIR: ${{ runner.temp }}/fitness-public-cache
