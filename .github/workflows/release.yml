# cspell:ignore goreleaser
name: Release
on:
  push:
    # Full versions only; the moving major tag (v1) must not start a release.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
concurrency:
  group: fitness-release
  cancel-in-progress: false
  queue: max
permissions:
  contents: write
jobs:
  verify:
    outputs:
      version: ${{ steps.report-step-1.outputs.version }}
    runs-on: ubuntu-latest
    # Observed max 40s on 2026-11-08, timed start to finish over the last 40
    # runs. The limit is that plus 25%, rounded up to the next minute.
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go-cache
      # It also writes the version as this step's output for later jobs.
      - name: Verify the tag matches the release version
        id: report-step-1
        run: go run ./cmd/fitness-release verify-tag --root ..
        working-directory: go
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "${{ job.status }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  binaries:
    needs: verify
    uses: ./.github/workflows/distribution.yml
  release:
    needs: binaries
    runs-on: ubuntu-latest
    # Observed max 42s on 2026-11-08, timed start to finish over the last 36
    # runs. Building fitness-ci adds about 15s, and the limit is that plus 25%,
    # rounded up to the next minute.
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: fitness-release
          path: out
      - uses: ./.github/actions/setup-go-cache
      - name: Build fitness-ci
        run: go -C go build -o ../bin/fitness-ci ./cmd/fitness-ci
      - name: Inspect release publication state
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bin/fitness-ci inspect-publication
      # Writing the notes on the draft means a failure leaves it unpublished.
      # GoReleaser keeps the notes when it publishes.
      - name: Write the release notes from changelog entry files
        if: ${{ steps.publication.outputs.draft == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/fitness-ci write-release-notes
      - name: Publish tested assets with GoReleaser
        if: ${{ steps.publication.outputs.draft == 'true' }}
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: v2.18.2
          args: release --clean --skip=archive --config .goreleaser-publish.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "${{ job.status }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  verify-download:
    needs: [release, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    # Observed max 1m18s on 2026-11-08, timed start to finish over the last 36
    # runs. The limit is that plus 25%, rounded up to the next minute.
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: fitness-release
          path: out
      - uses: ./.github/actions/setup-go-cache
      - name: Build fitness-ci
        run: go -C go build -o ../bin/fitness-ci ./cmd/fitness-ci
      - name: Verify public downloads with the Go tool
        id: verify-download
        env:
          VERIFIER: out/fitness-release-${{ matrix.platform }}
          FITNESS_CACHE_DIR: ${{ runner.temp }}/fitness-public-cache
          FITNESS_TEST_TOOL_PATH: ${{ runner.temp }}/fitness-consumer-tools
        run: bin/fitness-ci run-verifier verify-download
      - uses: ./.github/actions/setup-go-cache
        with:
          cache-key: smoke
      - name: Run the full suite through the released action
        id: released-suite
        uses: ./
        with:
          policy: external
          version: ${{ needs.verify.outputs.version }}
          # The engine holds no checks, so the suite runs the ones this repo pins.
          with-checks: pinned
        env:
          FITNESS_CACHE_DIR: ${{ runner.temp }}/fitness-public-cache
      - name: Retain complete Fitness reports
        if: ${{ always() }}
        uses: ./.github/actions/fitness-reports
        with:
          fitness-failed: ${{ steps.verify-download.outcome == 'failure' || steps.released-suite.outcome == 'failure' }}
          job-status: ${{ job.status }}
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "${{ job.status }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: [verify-download, verify]
    runs-on: ubuntu-latest
    # Observed max 53s on 2026-11-08, timed start to finish over the last 36
    # runs. The limit is that plus 25%, rounded up to the next minute.
    timeout-minutes: 2
    steps:
      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/download-artifact@v4
        with:
          name: fitness-release
          path: out
      - uses: ./.github/actions/setup-go-cache
      - name: Build fitness-ci
        run: go -C go build -o ../bin/fitness-ci ./cmd/fitness-ci
      - name: Promote the verified release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bin/fitness-ci promote-release
      - name: Publish the Go module tag
        env:
          RELEASE_TAG: v${{ needs.verify.outputs.version }}
        run: bin/fitness-ci publish-go-module-tag
      # Consumers pin the major version; each verified release that is the
      # newest moves it, so @v1 always means the newest 1.x.
      - name: Move the major version tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: v${{ needs.verify.outputs.version }}
        run: bin/fitness-ci move-engine-major-tag
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "${{ job.status }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
