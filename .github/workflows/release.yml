name: Release
on:
  push:
    tags: ['go/v*']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the tag matches the newest CHANGELOG heading
        run: |
          want="$(.github/scripts/release-tag.sh)"
          test "$GITHUB_REF_NAME" = "$want" || {
            echo "tag $GITHUB_REF_NAME does not match CHANGELOG-derived $want" >&2
            exit 1
          }
  binaries:
    needs: verify
    uses: ./.github/workflows/distribution.yml
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fitness-release
          path: out
      - name: Extract newest CHANGELOG section as release notes
        run: awk '/^### /{n++} n==1' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - name: Publish tested bundles and shell installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.tar.gz out/checksums.txt out/fitness.sh \
            --verify-tag --title "fitness ${GITHUB_REF_NAME#go/}" --notes-file "$RUNNER_TEMP/notes.md"
