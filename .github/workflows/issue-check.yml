name: Issue check

# This repo runs the reusable workflow it publishes, built from this commit, so
# the code under review judges each issue, dupe-check included.
on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # The called job's edit and label guard and per-issue queue apply here too,
  # so an idle event still starts no runner.
  issue-check:
    uses: ./.github/workflows/issue-check-reusable.yml
    with:
      ref: ${{ github.sha }}
