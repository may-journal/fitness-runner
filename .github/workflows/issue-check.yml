name: Issue check

on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  issue-check:
    # An edit that left the body alone, or a verdict label, cannot change a
    # verdict. A skipped job starts no runner, so it bills nothing; fitness
    # issue-check skips the same events when run another way.
    if: >-
      github.event_name != 'issues' ||
      ((github.event.action != 'edited' || github.event.changes.body) &&
      (github.event.action != 'labeled' || !contains(fromJSON('["fitness", "fitness-valid", "fitness-invalid"]'), github.event.label.name)))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    # Agents edit an Issue in quick bursts; only the newest body needs a verdict.
    concurrency:
      group: issue-check-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-cache
      - name: Build the checks
        run: cd go && mkdir -p bin && go build -o bin ./cmd/...
      - name: Validate issue(s) by kind, keep one verdict comment, and label it
        id: report-step-1
        run: go/bin/fitness issue-check
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain complete Fitness reports
        id: fitness-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fitness-reports-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}-${{ env.FITNESS_REPORT_ID }}
          path: ${{ runner.temp }}/fitness-reports/
          if-no-files-found: ignore
          retention-days: 7
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
          REPORT_ARTIFACT_URL: ${{ steps.fitness-reports.outputs.artifact-url }}
          REPORT_ALREADY_ANNOTATED: ${{ steps.fitness-reports.outcome != 'failure' && env.FITNESS_FAILURE_REPORTED == 'true' && (steps.report-step-1.outcome == 'failure') }}
        run: |
          if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPORT_ARTIFACT_URL" ]; then
            printf '\n[Download complete Fitness reports](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
