name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fitness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: cd go && go build -o bin ./cmd/...
      - run: go/bin/fitness

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: test -z "$(gofmt -l go)"
      - run: cd go && go vet ./...
      - run: cd go && go build -o bin ./cmd/...
      - run: cd go && go test ./...
