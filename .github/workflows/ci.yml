name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fitness:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so a pull request can diff against its base branch.
          fetch-depth: 0
      - uses: ./.github/actions/setup-go-cache
        with:
          cache-key: fitness
          save: true
      - run: cd go && mkdir -p bin && go build -o bin ./cmd/...
      # A pull request checks the files it changes, and a push to main checks
      # every file. The token lets workflow-ref-exists read refs on GitHub.
      - run: go/bin/fitness --json="$RUNNER_TEMP/fitness-performance/fitness.json"
        id: report-step-1
        env:
          GH_TOKEN: ${{ github.token }}
      # The box diagram rides in the same artifact: see docs/ci.md#box-diagram.
      - name: Draw the box diagram
        if: ${{ !cancelled() && steps.report-step-1.outcome != 'skipped' }}
        # Fitness may have died before it wrote the report.
        run: |
          report="$RUNNER_TEMP/fitness-performance/fitness.json"
          if [ -f "$report" ]; then
            go/bin/fitness boxes "$report" "$RUNNER_TEMP/fitness-performance/fitness.html"
          fi
      # The performance trail: see docs/ci.md#performance-record.
      - name: Retain the performance record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fitness-performance-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fitness-performance/
          if-no-files-found: ignore
          retention-days: 90
      - name: Retain complete Fitness reports
        id: fitness-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fitness-reports-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}-${{ env.FITNESS_REPORT_ID }}
          path: ${{ runner.temp }}/fitness-reports/
          if-no-files-found: ignore
          retention-days: 7
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
          REPORT_ARTIFACT_URL: ${{ steps.fitness-reports.outputs.artifact-url }}
          REPORT_ALREADY_ANNOTATED: ${{ steps.fitness-reports.outcome != 'failure' && env.FITNESS_FAILURE_REPORTED == 'true' && (steps.report-step-1.outcome == 'failure') }}
        run: |
          if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPORT_ARTIFACT_URL" ]; then
            printf '\n[Download complete Fitness reports](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

  release-please:
    concurrency:
      group: fitness-release-please
      cancel-in-progress: false
      queue: max
    needs: fitness
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      pr: ${{ fromJSON(steps.report-step-1.outputs.pr || '{}').number }}
    steps:
      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/setup-go-cache
      - name: Prepare releases with Release Please
        id: report-step-1
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Apply the repository PR template to the release PR
        if: ${{ steps.report-step-1.outputs.pr != '' }}
        id: report-step-2
        run: go run ./cmd/fitness-release release-pr --root ..
        working-directory: go
        env:
          RELEASE_PR: ${{ steps.report-step-1.outputs.pr }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Retain complete Fitness reports
        id: fitness-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fitness-reports-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}-${{ env.FITNESS_REPORT_ID }}
          path: ${{ runner.temp }}/fitness-reports/
          if-no-files-found: ignore
          retention-days: 7
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
          REPORT_ARTIFACT_URL: ${{ steps.fitness-reports.outputs.artifact-url }}
          REPORT_ALREADY_ANNOTATED: ${{ steps.fitness-reports.outcome != 'failure' && env.FITNESS_FAILURE_REPORTED == 'true' && (steps.report-step-1.outcome == 'failure' || steps.report-step-2.outcome == 'failure') }}
        run: |
          if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPORT_ARTIFACT_URL" ]; then
            printf '\n[Download complete Fitness reports](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The approver approves the release PR once its checks are green. Its job
  # reads the PR and its checks with the run token.
  release-approve:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    uses: ./.github/workflows/release-approve.yml
    with:
      pr: ${{ needs.release-please.outputs.pr }}
    secrets:
      APPROVER_TOKEN: ${{ secrets.APPROVER_TOKEN }}
