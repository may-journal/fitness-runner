name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fitness:
    runs-on: ubuntu-24.04-arm
    # Observed max 56s on 2026-11-02. A pull request's two scans share the
    # run's 450s test total, so the suite and its setup fit.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so a pull request can diff against its base branch.
          fetch-depth: 0
      - uses: ./.github/actions/setup-go-cache
        with:
          cache-key: fitness
          save: true
      - run: cd go && mkdir -p bin && go build -o bin ./cmd/...
      # A pull request checks the files it changes, and a push to main checks
      # every file. The token lets workflow-ref-exists read refs on GitHub.
      - run: go/bin/fitness --json="$RUNNER_TEMP/fitness-performance/fitness.json"
        id: suite
        env:
          GH_TOKEN: ${{ github.token }}
      # Each check's time, slowest first, read back from the kept record. A
      # suite that never wrote one already failed, so this step stays quiet.
      - run: |
          record="$RUNNER_TEMP/fitness-performance/fitness.json"
          if [ -f "$record" ]; then go/bin/fitness perf "$record"; fi
        if: ${{ !cancelled() }}
      # The action draws the box diagram, then keeps it with the performance
      # record and the complete reports.
      - name: Retain the performance record and complete reports
        if: ${{ always() }}
        uses: ./.github/actions/fitness-reports
        with:
          fitness: go/bin/fitness
          job-status: ${{ job.status }}
          fitness-failed: ${{ steps.suite.outcome == 'failure' }}
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "${{ job.status }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  release-please:
    concurrency:
      group: fitness-release-please
      cancel-in-progress: false
      queue: max
    needs: fitness
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    outputs:
      pr: ${{ fromJSON(steps.report-step-1.outputs.pr || '{}').number }}
    steps:
      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/setup-go-cache
      - name: Prepare releases with Release Please
        id: report-step-1
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Apply the repository PR template to the release PR
        if: ${{ steps.report-step-1.outputs.pr != '' }}
        id: report-step-2
        run: go run ./cmd/fitness-release release-pr --root ..
        working-directory: go
        env:
          RELEASE_PR: ${{ steps.report-step-1.outputs.pr }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "${{ job.status }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  # The approver approves the release PR once its checks are green. Its job
  # reads the PR and its checks with the run token.
  release-approve:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    uses: ./.github/workflows/release-approve.yml
    with:
      pr: ${{ needs.release-please.outputs.pr }}
    secrets:
      APPROVER_TOKEN: ${{ secrets.APPROVER_TOKEN }}
