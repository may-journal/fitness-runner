name: Issue check (reusable)

# Reusable across the org: a consumer repo calls this from an `issues`-triggered
# caller. It installs the published fitness checks and validates the calling
# repo's issue(s) by kind label — the shape of the kind's issue template, the
# kind's own checks, and the prose/markdown checks on the body — keeping one
# verdict comment and label per Issue. An issue with no kind label passes.
# The same job then runs dupe-check, so one issue event starts one runner,
# which bills one minute where two jobs billed two.
# fitness-runner keeps its own build-from-source issue-check so it still tests
# its own unreleased changes.
on:
  workflow_call:
    inputs:
      ref:
        description: Optional source ref to compile; empty uses the pinned binary release.
        type: string
        default: ''
      command:
        description: The fitness command to run, issue-check or its Plan-only alias plan-check.
        type: string
        default: issue-check
      dupe-check:
        description: Also run fitness dupe-check in the same job. plan-check-reusable turns it off.
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  issue-check:
    # An edit that left the title and body alone, or a verdict label, can
    # change neither the verdict nor the dupe note. A skipped job starts no
    # runner, so it bills nothing; fitness issue-check also skips a title-only
    # edit, which only dupe-check scores.
    if: >-
      github.event_name != 'issues' ||
      ((github.event.action != 'edited' || github.event.changes.body || github.event.changes.title) &&
      (github.event.action != 'labeled' || !contains(fromJSON('["fitness", "fitness-valid", "fitness-invalid"]'), github.event.label.name)))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    # One queue per Issue: an edit never cancels the opened run, the only one
    # that can close the Issue as a duplicate. A burst still ends in one
    # verdict, since GitHub keeps only the newest pending run.
    concurrency:
      group: issue-check-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: ${{ inputs.ref != '' }}
        with:
          go-version: stable
          # No go.sum exists to key on, so the cache would only log a warning.
          cache: false
      - name: Install the pinned fitness bundle
        id: report-step-1
        if: ${{ inputs.ref == '' }}
        uses: may-journal/fitness-runner@v1
        with:
          install-only: 'true'
      - name: Build an explicitly requested source ref
        if: ${{ inputs.ref != '' }}
        env:
          GOPROXY: direct
          FITNESS_SOURCE_REF: ${{ inputs.ref }}
        run: |
          go install "github.com/may-journal/fitness-runner/go/cmd/...@$FITNESS_SOURCE_REF"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate issue(s) by kind, keep one verdict comment, and label it
        id: report-step-2
        # plan-check-reusable passes plan-check to judge Plans only.
        run: |
          case "$FITNESS_COMMAND" in
            issue-check|plan-check) fitness "$FITNESS_COMMAND" ;;
            *) printf '::error::command must be issue-check or plan-check, not %s\n' "$FITNESS_COMMAND"; exit 1 ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
          FITNESS_COMMAND: ${{ inputs.command }}
      # An invalid issue may still repeat an older one, so this runs after a
      # failed verdict too, once fitness is installed. A label cannot change
      # the note, so a labeled event skips it.
      - name: Note older issues this one resembles, or sweep every pair
        id: report-step-3
        if: ${{ !cancelled() && inputs.dupe-check && steps.report-step-2.outcome != 'skipped' && github.event.action != 'labeled' }}
        run: fitness dupe-check
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain complete Fitness reports
        id: fitness-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fitness-reports-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}-${{ env.FITNESS_REPORT_ID }}
          path: ${{ runner.temp }}/fitness-reports/
          if-no-files-found: ignore
          retention-days: 7
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
          REPORT_ARTIFACT_URL: ${{ steps.fitness-reports.outputs.artifact-url }}
          REPORT_ALREADY_ANNOTATED: ${{ steps.fitness-reports.outcome != 'failure' && env.FITNESS_FAILURE_REPORTED == 'true' && (steps.report-step-1.outcome == 'failure' || steps.report-step-2.outcome == 'failure' || steps.report-step-3.outcome == 'failure') }}
        run: |
          if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPORT_ARTIFACT_URL" ]; then
            printf '\n[Download complete Fitness reports](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
