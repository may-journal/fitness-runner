name: Plan check

on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  plan-check:
    # Issue events: only Plan-labeled issues. Manual sweep: always run.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'Plan')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Build the checks
        run: cd go && mkdir -p bin && go build -o bin ./cmd/...
      - name: Validate plan issue(s) and comment once per body version
        run: go/bin/fitness plan-check
        env:
          GH_TOKEN: ${{ github.token }}
