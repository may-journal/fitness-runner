name: Plan check

on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  plan-check:
    # Issue events: only Plan-labeled issues. Manual sweep: always run.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'Plan')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Build the plan-structure check
        run: cd go && go build -o bin/fitness-check-plan-structure ./cmd/fitness-check-plan-structure
      - name: Validate plan issue(s) and comment once per body version
        uses: actions/github-script@v7
        env:
          CHECK_BIN: ${{ github.workspace }}/go/bin/fitness-check-plan-structure
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const crypto = require('node:crypto');
            const bin = process.env.CHECK_BIN;
            const { owner, repo } = context.repo;
            const marker = (hash) => `<!-- fitness:plan-structure:${hash} -->`;

            async function targets() {
              if (context.eventName === 'workflow_dispatch') {
                const issues = await github.paginate(github.rest.issues.listForRepo, {
                  owner, repo, labels: 'Plan', state: 'open', per_page: 100,
                });
                return issues
                  .filter((i) => !i.pull_request)
                  .map((i) => ({ number: i.number, body: i.body || '' }));
              }
              const i = context.payload.issue;
              return [{ number: i.number, body: i.body || '' }];
            }

            function validate(body) {
              try {
                return JSON.parse(execFileSync(bin, [], { input: body, encoding: 'utf8' }));
              } catch (e) {
                // A validation failure exits non-zero but still prints the JSON result.
                if (e.stdout) return JSON.parse(e.stdout);
                throw e;
              }
            }

            let failed = false;
            for (const t of await targets()) {
              const hash = crypto.createHash('sha256').update(t.body).digest('hex').slice(0, 12);
              const mark = marker(hash);
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: t.number, per_page: 100,
              });
              const alreadyCommented = comments.some((c) => (c.body || '').includes(mark));

              const res = validate(t.body);
              if (!res.ok) failed = true;
              if (alreadyCommented) continue;

              const heading = res.ok
                ? '✅ Plan structure looks good.'
                : '❌ Plan structure needs work:';
              const list = res.ok ? '' : '\n' + res.errors.map((e) => `- ${e}`).join('\n');
              await github.rest.issues.createComment({
                owner, repo, issue_number: t.number,
                body: `${heading}${list}\n\n${mark}`,
              });
            }

            if (failed) core.setFailed('One or more plan issues have structure violations.');
