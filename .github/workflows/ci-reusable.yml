name: CI (reusable)

# The shared fitness file-suite build. A calling repo's ci.yml is a thin
# caller that passes only its inputs; the whole build lives here.
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label. ubuntu-latest runs swiftlint too, at a tenth of the macOS cost.
        type: string
        default: ubuntu-latest
      swift:
        description: Always install swiftlint. It is also installed when the checkout has Swift files. Linux runners get the official Linux build.
        type: boolean
        default: false
      swiftlint-version:
        description: SwiftLint release to install on every runner, so CI and laptops lint alike.
        type: string
        default: 0.65.1
      ref:
        description: Optional source ref to compile; empty uses the pinned binary release.
        type: string
        default: ''

jobs:
  fitness:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and the PR head (not the merge commit) so
          # changelog-updated, semantic-commit, and plan-trailer see a real
          # commit and its ancestry, and a pull request can diff against its
          # base branch to check only the files it changes.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        if: ${{ inputs.ref != '' || hashFiles('**/go.mod') != '' }}
        with:
          go-version: stable
      # Node repos: the prettier, vitest, node-version, and dependency-currency
      # checks run the repo's own installed tools, as on a laptop.
      - name: Set up Node from .nvmrc
        if: ${{ hashFiles('.nvmrc') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install npm packages
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci
      - name: Install the pinned fitness bundle
        id: report-step-1
        if: ${{ inputs.ref == '' }}
        uses: may-journal/fitness-runner@go/v0.20261004.951
        with:
          install-only: 'true'
      - name: Build an explicitly requested source ref
        if: ${{ inputs.ref != '' }}
        env:
          GOPROXY: direct
          FITNESS_SOURCE_REF: ${{ inputs.ref }}
        run: |
          go install "github.com/may-journal/fitness-runner/go/cmd/...@$FITNESS_SOURCE_REF"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # One pinned SwiftLint everywhere: "latest" let a release add a rule
      # overnight that laptops had never seen.
      - name: Install swiftlint
        if: ${{ inputs.swift || hashFiles('**/*.swift') != '' }}
        env:
          VERSION: ${{ inputs.swiftlint-version }}
          ASSET: ${{ runner.os == 'macOS' && 'portable_swiftlint' || (runner.arch == 'ARM64' && 'swiftlint_linux_arm64' || 'swiftlint_linux_amd64') }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${VERSION}/${ASSET}.zip"
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          chmod +x "$RUNNER_TEMP/swiftlint/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version
      - name: Run fitness
        id: report-step-2
        run: fitness
      - name: Retain complete Fitness reports
        id: fitness-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fitness-reports-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}-${{ env.FITNESS_REPORT_ID }}
          path: ${{ runner.temp }}/fitness-reports/
          if-no-files-found: ignore
          retention-days: 7
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
          REPORT_ARTIFACT_URL: ${{ steps.fitness-reports.outputs.artifact-url }}
          REPORT_ALREADY_ANNOTATED: ${{ steps.fitness-reports.outcome != 'failure' && env.FITNESS_FAILURE_REPORTED == 'true' && (steps.report-step-1.outcome == 'failure' || steps.report-step-2.outcome == 'failure') }}
        run: |
          if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPORT_ARTIFACT_URL" ]; then
            printf '\n[Download complete Fitness reports](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
