name: CI (reusable)

# cspell:ignore temurin sdkmanrc
#
# The shared fitness file-suite build. A calling repo's ci.yml is a thin
# caller that passes only its inputs; the whole build lives here.
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label. The arm default bills 37% less a minute than x64 Linux and a tenth of macOS, and runs swiftlint too.
        type: string
        default: ubuntu-24.04-arm
      swift:
        description: Always install swiftlint. It is also installed when the checkout has Swift files. Linux runners get the official Linux build.
        type: boolean
        default: false
      swiftlint-version:
        description: SwiftLint release to install on every runner, so CI and laptops lint alike.
        type: string
        default: 0.65.1
      java-distribution:
        description: JDK vendor setup-java installs for a repo with a JDK version file, such as temurin, zulu or corretto.
        type: string
        default: temurin
      ref:
        description: Optional source ref to compile; empty uses the pinned binary release.
        type: string
        default: ''
      pr-check:
        description: On a pull request, also run fitness pr-check on its title and body. The caller grants pull-requests and issues read.
        type: boolean
        default: true

jobs:
  fitness:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    # An edit that left the base alone changed only the title or body, which
    # pr-check alone judges, so the suite and its tool installs skip.
    env:
      FITNESS_SUITE: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and the PR head (not the merge commit) so
          # changelog-updated, semantic-commit, and plan-trailer see a real
          # commit and its ancestry, and a pull request can diff against its
          # base branch to check only the files it changes.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Go repos: the Go the repo's go.mod names, the root one or else the
      # shallowest, so setup-go uses the runner's copy instead of
      # downloading the newest stable release for 9-16 s.
      - name: Find the Go module file
        id: go-module
        if: ${{ inputs.ref != '' || (env.FITNESS_SUITE == 'true' && hashFiles('**/go.mod') != '') }}
        shell: bash
        run: |
          file=$(git ls-files -- go.mod '*/go.mod' | awk -F/ '{ print NF, $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)
          echo "file=${file:-}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        id: go
        if: ${{ steps.go-module.outcome == 'success' }}
        with:
          go-version: ${{ steps.go-module.outputs.file == '' && 'stable' || '' }}
          go-version-file: ${{ steps.go-module.outputs.file }}
          # No org repo has a go.sum to key on, so setup-go's cache would
          # only log a warning; the next step caches the build instead.
          cache: false
      # go-test and go-vet compile for 26-28 s with a cold build cache. Each
      # run saves the cache under its source hash, so the PR's next push
      # restores it and compiles only what changed.
      - name: Restore the Go build cache
        if: ${{ steps.go.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.mod', '**/*.go') }}
          restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-
      # Node repos: the prettier, vitest, node-version, and dependency-currency
      # checks run the repo's own installed tools, as on a laptop.
      - name: Set up Node from .nvmrc
        if: ${{ env.FITNESS_SUITE == 'true' && hashFiles('.nvmrc') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # npm ci then fills node_modules from the cached downloads.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Install npm packages
        if: ${{ env.FITNESS_SUITE == 'true' && hashFiles('package-lock.json') != '' }}
        run: npm ci
      # Java repos: the spotless, checkstyle, java-version, and java-test
      # checks run the build with the JDK a root version file pins, in the
      # java-version check's order. A .sdkmanrc or .tool-versions counts
      # only with a java line, since it may pin other tools alone.
      - name: Find the JDK version file
        id: jdk
        if: ${{ env.FITNESS_SUITE == 'true' && hashFiles('.java-version', '.sdkmanrc', '.tool-versions') != '' }}
        shell: bash
        run: |
          if [ -f .java-version ]; then file=.java-version
          elif grep -qs '^java[[:space:]]*=' .sdkmanrc; then file=.sdkmanrc
          elif grep -qs '^java[[:space:]]' .tool-versions; then file=.tool-versions
          fi
          echo "file=${file:-}" >> "$GITHUB_OUTPUT"
      - name: Set up Java from the JDK version file
        if: ${{ steps.jdk.outputs.file != '' }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version-file: ${{ steps.jdk.outputs.file }}
      - name: Install the pinned fitness bundle
        id: report-step-1
        if: ${{ inputs.ref == '' }}
        uses: may-journal/fitness-runner@v1
        with:
          install-only: 'true'
      - name: Build an explicitly requested source ref
        id: source
        if: ${{ inputs.ref != '' }}
        env:
          GOPROXY: direct
          FITNESS_SOURCE_REF: ${{ inputs.ref }}
        run: |
          go install "github.com/may-journal/fitness-runner/go/cmd/...@$FITNESS_SOURCE_REF"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # One pinned SwiftLint everywhere: "latest" let a release add a rule
      # overnight that laptops had never seen. The zip is cached per version
      # and platform, which saves its 2-5 s download on every later run.
      - name: Restore the SwiftLint download
        id: swiftlint-zip
        if: ${{ env.FITNESS_SUITE == 'true' && (inputs.swift || hashFiles('**/*.swift') != '') }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/fitness-swiftlint
          key: swiftlint-${{ inputs.swiftlint-version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install swiftlint
        if: ${{ env.FITNESS_SUITE == 'true' && (inputs.swift || hashFiles('**/*.swift') != '') }}
        env:
          VERSION: ${{ inputs.swiftlint-version }}
          ASSET: ${{ runner.os == 'macOS' && 'portable_swiftlint' || (runner.arch == 'ARM64' && 'swiftlint_linux_arm64' || 'swiftlint_linux_amd64') }}
        run: |
          zip="$HOME/.cache/fitness-swiftlint/${ASSET}.zip"
          if [ ! -f "$zip" ]; then
            mkdir -p "$(dirname "$zip")"
            curl -fsSL -o "$zip" \
              "https://github.com/realm/SwiftLint/releases/download/${VERSION}/${ASSET}.zip"
          fi
          unzip -q -o "$zip" -d "$RUNNER_TEMP/swiftlint"
          chmod +x "$RUNNER_TEMP/swiftlint/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version
      # workflow-ref-exists asks GitHub whether each may-journal `uses:` path
      # exists at its tag or sha; without a token it skips with a note.
      - name: Run fitness
        id: report-step-2
        if: ${{ env.FITNESS_SUITE == 'true' }}
        # A caller may run this workflow from several jobs, which all share
        # one job name here, so a random id keeps each artifact name unique.
        run: |
          printf 'FITNESS_PERFORMANCE_ID=%s\n' "$RANDOM$RANDOM$RANDOM" >> "$GITHUB_ENV"
          fitness --json="$RUNNER_TEMP/fitness-performance/fitness.json"
        env:
          GH_TOKEN: ${{ github.token }}
      # One job per PR push: pr-check shares this checkout and install, where
      # its own job billed a second minute. It runs after failed checks too,
      # so one run lists both, and it fails the job on its own findings.
      - name: Validate the PR description and fail the run on violations
        id: report-step-3
        if: ${{ !cancelled() && inputs.pr-check && github.event_name == 'pull_request' && (steps.report-step-1.outcome == 'success' || steps.source.outcome == 'success') }}
        run: fitness pr-check
        env:
          GH_TOKEN: ${{ github.token }}
      # The box diagram rides in the same artifact: see docs/ci.md#box-diagram.
      - name: Draw the box diagram
        if: ${{ !cancelled() && steps.report-step-2.outcome != 'skipped' }}
        # Fitness may have died before it wrote the report.
        run: |
          report="$RUNNER_TEMP/fitness-performance/fitness.json"
          if [ -f "$report" ]; then
            fitness boxes "$report" "$RUNNER_TEMP/fitness-performance/fitness.html"
          fi
      # The performance trail: see docs/ci.md#performance-record.
      - name: Retain the performance record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fitness-performance-${{ github.job }}-${{ github.run_attempt }}-${{ env.FITNESS_PERFORMANCE_ID }}
          path: ${{ runner.temp }}/fitness-performance/
          if-no-files-found: ignore
          retention-days: 90
      - name: Retain complete Fitness reports
        id: fitness-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fitness-reports-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}-${{ env.FITNESS_REPORT_ID }}
          path: ${{ runner.temp }}/fitness-reports/
          if-no-files-found: ignore
          retention-days: 7
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
          REPORT_ARTIFACT_URL: ${{ steps.fitness-reports.outputs.artifact-url }}
          REPORT_ALREADY_ANNOTATED: ${{ steps.fitness-reports.outcome != 'failure' && env.FITNESS_FAILURE_REPORTED == 'true' && (steps.report-step-1.outcome == 'failure' || steps.report-step-2.outcome == 'failure' || steps.report-step-3.outcome == 'failure') }}
        run: |
          if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPORT_ARTIFACT_URL" ]; then
            printf '\n[Download complete Fitness reports](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
