name: CI (reusable)

# cspell:ignore temurin sdkmanrc
#
# The shared fitness file-suite build. A calling repo's ci.yml is a thin
# caller that passes only its inputs; the whole build lives here.
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label. Empty picks the self-hosted fitness runners in a private repo, and otherwise ubuntu-24.04-arm, which bills 37% less a minute than x64 Linux.
        type: string
        default: ''
      swift:
        description: Always install swiftlint. It is also installed when the checkout has Swift files. Each runner gets the official build for its platform.
        type: boolean
        default: false
      swiftlint-version:
        description: SwiftLint release to install on every runner, so CI and laptops lint alike.
        type: string
        default: 0.65.1
      java-distribution:
        description: JDK vendor setup-java installs for a repo with a JDK version file, such as temurin, zulu or corretto.
        type: string
        default: temurin
      ref:
        description: Optional source ref to compile; empty uses the pinned binary release.
        type: string
        default: ''
      pr-check:
        description: On a pull request, also run fitness pr-check on its title and body. The caller must grant pull-requests and issues read.
        type: boolean
        default: false

jobs:
  fitness:
    # A private repo's own branches run in the self-hosted fitness group, which bills no minutes.
    # Public repos and any pull request whose head lives elsewhere, a deleted fork too, stay hosted.
    runs-on: ${{ inputs.runs-on || github.event.repository.private && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('{"group":"fitness","labels":"fitness"}') || 'ubuntu-24.04-arm' }}
    # Observed max 7m54s on 2026-11-07, across the org's repos. A pull
    # request's two scans share the run's 450s test total, so the suite fits.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history at the PR head lets the commit checks see real commits
          # and their ancestry. A pull request then diffs against its base to
          # check only the files it changes.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Go repos use the Go their root or shallowest go.mod names, so setup-go
      # takes the runner's copy instead of a 9-16 s download. A fitness/go.mod
      # picks the Go that builds the repo's own Go checks.
      - name: Find the Go module file
        id: go-module
        if: ${{ inputs.ref != '' || hashFiles('**/go.mod') != '' }}
        shell: bash
        run: |
          file=$(git ls-files -- go.mod '*/go.mod' | awk -F/ '{ print NF, $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)
          echo "file=${file:-}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        id: go
        if: ${{ steps.go-module.outcome == 'success' }}
        with:
          # A source build of fitness keeps the newest stable Go it needs.
          go-version: ${{ (inputs.ref != '' || steps.go-module.outputs.file == '') && 'stable' || '' }}
          go-version-file: ${{ inputs.ref == '' && steps.go-module.outputs.file || '' }}
          # No org repo has a go.sum for setup-go's cache to key on. The next
          # step caches the build instead.
          cache: false
      # go-test and go-vet compile for 26-28 s with a cold build cache. A
      # hosted run saves it by source hash and a Mac keeps it on disk.
      - name: Restore the Go build cache
        if: ${{ steps.go.outcome == 'success' && runner.environment == 'github-hosted' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.mod', '**/*.go') }}
          restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-
      # Node repos: the prettier, vitest, node-version, and dependency-currency
      # checks run the repo's own installed tools, as on a laptop.
      - name: Set up Node from .nvmrc
        if: ${{ hashFiles('.nvmrc') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # npm ci then fills node_modules from the cached downloads.
          # A self-hosted runner keeps ~/.npm on its disk, so it skips the cache.
          cache: ${{ runner.environment == 'github-hosted' && hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Install npm packages
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci
      # Java repos build with the JDK a root version file pins, read in the
      # java-version check's order. A .sdkmanrc or .tool-versions counts only
      # with a java line, since it may pin other tools alone.
      - name: Find the JDK version file
        id: jdk
        if: ${{ hashFiles('.java-version', '.sdkmanrc', '.tool-versions') != '' }}
        shell: bash
        run: |
          if [ -f .java-version ]; then file=.java-version
          elif grep -qs '^java[[:space:]]*=' .sdkmanrc; then file=.sdkmanrc
          elif grep -qs '^java[[:space:]]' .tool-versions; then file=.tool-versions
          fi
          echo "file=${file:-}" >> "$GITHUB_OUTPUT"
      - name: Set up Java from the JDK version file
        if: ${{ steps.jdk.outputs.file != '' }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version-file: ${{ steps.jdk.outputs.file }}
      # `$/` names this repo at the running commit, so the shared actions
      # match this workflow's version.
      - name: Install the pinned fitness bundle or the requested source ref
        id: install
        uses: $/.github/actions/fitness-install
        with:
          ref: ${{ inputs.ref }}
      # One pinned SwiftLint everywhere: "latest" let a release add a rule
      # overnight that laptops had never seen. A hosted run caches the zip and
      # a Mac keeps it on disk, saving a 2-5 s download.
      - name: Restore the SwiftLint download
        id: swiftlint-zip
        if: ${{ (inputs.swift || hashFiles('**/*.swift') != '') && runner.environment == 'github-hosted' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/fitness-swiftlint
          key: swiftlint-zip-${{ inputs.swiftlint-version }}-${{ runner.os }}-${{ runner.arch }}
      # macOS gets portable_swiftlint, which loads SourceKit from Xcode. Each
      # zip must match its published SHA-256 and lands under a versioned name.
      - name: Install swiftlint
        if: ${{ (inputs.swift || hashFiles('**/*.swift') != '') }}
        env:
          VERSION: ${{ inputs.swiftlint-version }}
          ASSET: ${{ runner.os == 'macOS' && 'portable_swiftlint' || (runner.arch == 'ARM64' && 'swiftlint_linux_arm64' || 'swiftlint_linux_amd64') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="$HOME/.cache/fitness-swiftlint/${ASSET}-${VERSION}.zip"
          want=
          for attempt in 1 2 3; do
            if want=$(gh api "repos/realm/SwiftLint/releases/tags/${VERSION}" \
              --jq ".assets[] | select(.name == \"${ASSET}.zip\") | .digest"); then
              break
            fi
            sleep "$attempt"
          done
          want="${want#sha256:}"
          if [ -z "$want" ]; then
            echo "::error::SwiftLint ${VERSION} publishes no SHA-256 for ${ASSET}.zip"
            exit 1
          fi
          if [ ! -f "$zip" ] || ! echo "$want  $zip" | shasum -a 256 -c - >/dev/null; then
            mkdir -p "$(dirname "$zip")"
            part="$zip.$GITHUB_RUN_ID.$GITHUB_JOB.$$"
            curl -fsSL --retry 3 -o "$part" \
              "https://github.com/realm/SwiftLint/releases/download/${VERSION}/${ASSET}.zip"
            if ! echo "$want  $part" | shasum -a 256 -c -; then
              rm -f "$part"
              echo "::error::SwiftLint ${VERSION} ${ASSET}.zip does not match its published SHA-256"
              exit 1
            fi
            mv -f "$part" "$zip"
          fi
          rm -rf "$RUNNER_TEMP/swiftlint"
          unzip -q -o "$zip" -d "$RUNNER_TEMP/swiftlint"
          chmod +x "$RUNNER_TEMP/swiftlint/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version
      # workflow-ref-exists asks GitHub whether each may-journal `uses:` path
      # exists at its tag or sha; without a token it skips with a note.
      - name: Run fitness
        id: suite
        run: fitness --json="$RUNNER_TEMP/fitness-performance/fitness.json"
        env:
          GH_TOKEN: ${{ github.token }}
      # One job per PR push: pr-check shares this checkout and install, where
      # its own job billed a second minute. It runs after failed checks too,
      # so one run lists both, and it fails the job on its own findings.
      - name: Validate the PR description and fail the run on violations
        id: pr-check
        if: ${{ !cancelled() && inputs.pr-check && github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
        run: fitness pr-check
        env:
          GH_TOKEN: ${{ github.token }}
      # The action draws the box diagram, then keeps it with the performance
      # record and the complete reports.
      - name: Retain the performance record and complete reports
        if: ${{ always() }}
        uses: $/.github/actions/fitness-reports
        with:
          job-status: ${{ job.status }}
          fitness-failed: ${{ steps.install.outcome == 'failure' || steps.suite.outcome == 'failure' || steps.pr-check.outcome == 'failure' }}
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "${{ job.status }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
