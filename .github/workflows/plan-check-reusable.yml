name: Plan check (reusable)

# Old callers still name this file, which runs issue-check-reusable at v1 with
# the Plan-only `plan-check` command. New callers use issue-check-reusable.yml.
on:
  workflow_call:
    inputs:
      ref:
        description: Optional source ref to compile; empty uses the pinned binary release.
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  plan-check:
    # Only a Plan's body or its Plan label can change its verdict. Other edits
    # and labels skip here, as fitness plan-check skips them elsewhere.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'Plan') &&
      (github.event.action != 'edited' || github.event.changes.body) &&
      (github.event.action != 'labeled' || github.event.label.name == 'Plan'))
    uses: may-journal/fitness-runner/.github/workflows/issue-check-reusable.yml@v1
    with:
      ref: ${{ inputs.ref }}
      command: plan-check
      # The synced issue-check caller runs dupe-check for every issue, so a
      # Plan here would get a second note.
      dupe-check: false
