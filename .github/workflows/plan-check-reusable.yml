name: Plan check (reusable)

# Reusable across the org: a consumer repo calls this from an `issues`-triggered
# caller. It installs the published fitness checks and validates the calling
# repo's Plan issue(s) — structure plus the prose/markdown checks on the body —
# keeping one verdict comment and label per Issue. fitness-runner keeps its own
# build-from-source plan-check so it still tests its own unreleased changes.
on:
  workflow_call:
    inputs:
      ref:
        description: Optional source ref to compile; empty uses the pinned binary release.
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  plan-check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'Plan')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: ${{ inputs.ref != '' }}
        with:
          go-version: stable
      - name: Install the pinned fitness bundle
        if: ${{ inputs.ref == '' }}
        uses: may-journal/fitness-runner@go/v0.20261004.900
        with:
          install-only: 'true'
      - name: Build an explicitly requested source ref
        if: ${{ inputs.ref != '' }}
        env:
          GOPROXY: direct
          FITNESS_SOURCE_REF: ${{ inputs.ref }}
        run: |
          go install "github.com/may-journal/fitness-runner/go/cmd/...@$FITNESS_SOURCE_REF"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate plan issue(s), keep one verdict comment, and label it
        run: fitness plan-check
        env:
          GH_TOKEN: ${{ github.token }}
