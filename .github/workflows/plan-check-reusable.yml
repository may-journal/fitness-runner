name: Plan check (reusable)

# Kept for consumer repos whose caller still names it: it runs
# issue-check-reusable at v1 with the Plan-only `plan-check` command, since a
# `./` path may resolve to the consumer repo. New callers use issue-check-reusable.yml.
on:
  workflow_call:
    inputs:
      ref:
        description: Optional source ref to compile; empty uses the pinned binary release.
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  plan-check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'Plan')
    uses: may-journal/fitness-runner/.github/workflows/issue-check-reusable.yml@v1
    with:
      ref: ${{ inputs.ref }}
      command: plan-check
