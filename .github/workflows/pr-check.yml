name: PR check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Build the checks
        run: cd go && mkdir -p bin && go build -o bin ./cmd/...
      - name: Validate PR description(s) and fail the run on violations
        run: go/bin/fitness pr-check
        env:
          GH_TOKEN: ${{ github.token }}
