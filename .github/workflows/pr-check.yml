name: PR check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Build the PR checks
        run: cd go && mkdir -p bin && go build -o bin ./cmd/fitness-check-pr-structure ./cmd/fitness-check-pr-closes-issue
      - name: Validate PR description(s) and fail the run on violations
        uses: actions/github-script@v7
        env:
          CHECK_BINS: |
            ${{ github.workspace }}/go/bin/fitness-check-pr-structure
            ${{ github.workspace }}/go/bin/fitness-check-pr-closes-issue
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const bins = process.env.CHECK_BINS.split('\n').map((s) => s.trim()).filter(Boolean);
            const { owner, repo } = context.repo;

            async function targets() {
              if (context.eventName === 'workflow_dispatch') {
                const prs = await github.paginate(github.rest.pulls.list, {
                  owner, repo, state: 'open', per_page: 100,
                });
                return prs.map((p) => ({ number: p.number, body: p.body || '' }));
              }
              const p = context.payload.pull_request;
              return [{ number: p.number, body: p.body || '' }];
            }

            function validate(bin, body) {
              try {
                return JSON.parse(execFileSync(bin, [], { input: body, encoding: 'utf8' }));
              } catch (e) {
                // A validation failure exits non-zero but still prints the JSON result.
                if (e.stdout) return JSON.parse(e.stdout);
                throw e;
              }
            }

            let failed = false;
            core.summary.addHeading('PR checks', 2);
            for (const t of await targets()) {
              const errors = bins.flatMap((bin) => validate(bin, t.body).errors);
              if (errors.length === 0) {
                core.summary.addRaw(`✅ #${t.number}: PR description looks good.`, true);
                continue;
              }
              failed = true;
              core.summary.addRaw(`❌ #${t.number}: PR description needs work:`, true);
              core.summary.addList(errors);
            }
            await core.summary.write();

            if (failed) core.setFailed('One or more PR descriptions have violations.');
