name: PR check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Build the checks
        run: cd go && mkdir -p bin && go build -o bin ./cmd/...
      - name: Validate PR description(s) and fail the run on violations
        uses: actions/github-script@v7
        env:
          BIN_DIR: ${{ github.workspace }}/go/bin
          WORKSPACE: ${{ github.workspace }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const fs = require('node:fs');
            const os = require('node:os');
            const path = require('node:path');
            const binDir = process.env.BIN_DIR;
            const workspace = process.env.WORKSPACE;
            const { owner, repo } = context.repo;
            const prCloses = path.join(binDir, 'fitness-check-pr-closes-issue');

            // Structure checks read the body on stdin; the prose/markdown doc
            // checks read it via --body-file with --root at the checkout so
            // their config (cspell wordlists, prose-budget limits) resolves.
            const structureBins = ['fitness-check-pr-structure'];
            const docBins = [
              'fitness-check-prose-budget',
              'fitness-check-text-readability',
              'fitness-check-markdown-no-bold-italic',
              'fitness-check-mermaid-callouts',
              'fitness-check-mermaid-callout-why',
              'fitness-check-mermaid-diagram-prose',
              'fitness-check-mermaid-diagram-table-gap',
              'fitness-check-mermaid-legend',
              'fitness-check-cspell',
            ];

            function runCheck(bin, args, input) {
              try {
                return JSON.parse(execFileSync(path.join(binDir, bin), args, { input, encoding: 'utf8' }));
              } catch (e) {
                // A validation failure exits non-zero but still prints the JSON result.
                if (e.stdout) return JSON.parse(e.stdout);
                throw e;
              }
            }

            // closedIssues parses a body's closing-keyword targets through the
            // pr-closes-issue binary, so the Plan side and PR side share one
            // keyword set instead of a divergent copy here.
            function closedIssues(bodyFile) {
              return JSON.parse(execFileSync(prCloses, ['--emit-closed', '--body-file', bodyFile], { encoding: 'utf8' }));
            }

            // requiredClosures: for each issue the PR closes that is a Plan, the
            // issues that Plan itself closes must be closed by the PR too.
            async function requiredClosures(prClosedNums) {
              const required = new Set();
              for (const n of prClosedNums) {
                let issue;
                try { issue = (await github.rest.issues.get({ owner, repo, issue_number: n })).data; }
                catch { continue; }
                if (!(issue.labels || []).some((l) => (l.name || l) === 'Plan')) continue;
                const planFile = path.join(os.tmpdir(), `plan-${n}.md`);
                fs.writeFileSync(planFile, issue.body || '');
                for (const m of closedIssues(planFile)) required.add(m);
              }
              return [...required];
            }

            async function validate(number, body, title) {
              const tmp = path.join(os.tmpdir(), `desc-${number}.md`);
              fs.writeFileSync(tmp, body);
              const errors = [];
              errors.push(...runCheck('fitness-check-semantic-commit', ['--message', title], undefined).errors);
              for (const bin of structureBins) errors.push(...runCheck(bin, [], body).errors);
              const required = await requiredClosures(closedIssues(tmp));
              const prArgs = ['--body-file', tmp];
              if (required.length) prArgs.push('--require-close=' + required.join(','));
              errors.push(...runCheck('fitness-check-pr-closes-issue', prArgs, undefined).errors);
              for (const bin of docBins) {
                errors.push(...runCheck(bin, ['--root', workspace, '--body-file', tmp], undefined).errors);
              }
              return errors;
            }

            async function targets() {
              if (context.eventName === 'workflow_dispatch') {
                const prs = await github.paginate(github.rest.pulls.list, {
                  owner, repo, state: 'open', per_page: 100,
                });
                return prs.map((p) => ({ number: p.number, body: p.body || '', title: p.title || '' }));
              }
              const p = context.payload.pull_request;
              return [{ number: p.number, body: p.body || '', title: p.title || '' }];
            }

            let failed = false;
            core.summary.addHeading('PR checks', 2);
            for (const t of await targets()) {
              const errors = await validate(t.number, t.body, t.title);
              if (errors.length === 0) {
                core.summary.addRaw(`✅ #${t.number}: PR description looks good.`, true);
                continue;
              }
              failed = true;
              core.summary.addRaw(`❌ #${t.number}: PR description needs work:`, true);
              core.summary.addList(errors);
            }
            await core.summary.write();

            if (failed) core.setFailed('One or more PR descriptions have violations.');
