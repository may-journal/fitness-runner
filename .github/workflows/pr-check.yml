name: PR check

# pr-check-reusable skips this repo, so this job runs the same shared action on
# the PR head's own source instead of the pinned bundle.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    # Pushes and edits come in bursts; only the newest PR state needs a check.
    concurrency:
      group: pr-check-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR description(s) from this PR's source and fail the run on violations
        uses: ./.github/actions/fitness-command
        with:
          command: pr-check
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "${{ job.status }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
