name: PR check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Build the pr-structure check
        run: cd go && go build -o bin/fitness-check-pr-structure ./cmd/fitness-check-pr-structure
      - name: Validate PR description(s) and fail the run on violations
        uses: actions/github-script@v7
        env:
          CHECK_BIN: ${{ github.workspace }}/go/bin/fitness-check-pr-structure
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const bin = process.env.CHECK_BIN;
            const { owner, repo } = context.repo;

            async function targets() {
              if (context.eventName === 'workflow_dispatch') {
                const prs = await github.paginate(github.rest.pulls.list, {
                  owner, repo, state: 'open', per_page: 100,
                });
                return prs.map((p) => ({ number: p.number, body: p.body || '' }));
              }
              const p = context.payload.pull_request;
              return [{ number: p.number, body: p.body || '' }];
            }

            function validate(body) {
              try {
                return JSON.parse(execFileSync(bin, [], { input: body, encoding: 'utf8' }));
              } catch (e) {
                // A validation failure exits non-zero but still prints the JSON result.
                if (e.stdout) return JSON.parse(e.stdout);
                throw e;
              }
            }

            let failed = false;
            core.summary.addHeading('PR structure', 2);
            for (const t of await targets()) {
              const res = validate(t.body);
              if (res.ok) {
                core.summary.addRaw(`✅ #${t.number}: PR structure looks good.`, true);
                continue;
              }
              failed = true;
              core.summary.addRaw(`❌ #${t.number}: PR structure needs work:`, true);
              core.summary.addList(res.errors);
            }
            await core.summary.write();

            if (failed) core.setFailed('One or more PR descriptions have structure violations.');
