name: Auto-merge on ready
# This caller runs auto-merge.yml on two events the org ruleset skips: a draft
# marked ready, and an approval of a native stack. Its
# pull_request_target event checks out no PR code, and only approvals of this
# repo's branches run, since a fork's PR gets no secrets.
on:
  pull_request_target:
    types: [ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event_name != 'pull_request_review' || (github.event.review.state == 'approved' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: may-journal/fitness-runner/.github/workflows/auto-merge.yml@v1
    secrets: inherit
