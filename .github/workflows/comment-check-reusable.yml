name: Comment check (reusable)

# On comments and reviews, the published `fitness comment-check` replies once to
# a failing comment and updates that reply when fixed. A submitted review is judged in one run, so ten review comments
# bill one minute instead of ten.
on:
  workflow_call:
    inputs:
      ref:
        description: Optional source ref to compile; empty uses the pinned binary release.
        type: string
        default: ''
      ignore-authors:
        description: Comma-separated logins to skip, replacing fitness's known bot list; fitness's own login stays skipped, and empty keeps the list.
        type: string
        default: ''

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment-check:
    # A known bot's comment skips before a runner starts, using KnownBots in
    # go/internal/metadata/comments.go or the ignore-authors input. An author
    # this filter misses still runs, and fitness comment-check skips it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.comment.user.login || github.event.review.user.login) != 'github-actions[bot]' &&
      (inputs.ignore-authors != '' || !contains(fromJSON('["may-journal-automation[bot]", "release-please[bot]", "dependabot[bot]"]'), (github.event.comment.user.login || github.event.review.user.login))) &&
      !contains(format(',{0},', inputs.ignore-authors), format(',{0},', (github.event.comment.user.login || github.event.review.user.login))))
    # A private repo runs on the self-hosted Fitness runners, which bill no
    # minutes against a hosted job's one-minute minimum. Their group admits
    # private repos only, so a public repo's fork PR never reaches them.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "fitness"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 5
    # Agents edit a comment in quick bursts; only the newest text needs a reply.
    concurrency:
      group: comment-check-${{ github.repository }}-${{ github.event_name }}-${{ github.event.comment.id || github.event.review.id || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Validate comment(s), keep one reply, and react
        uses: $/.github/actions/fitness-command
        env:
          FITNESS_COMMENT_IGNORE_AUTHORS: ${{ inputs.ignore-authors }}
        with:
          command: comment-check
          ref: ${{ inputs.ref }}
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "${{ job.status }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
