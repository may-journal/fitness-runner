name: Close check

# This repo runs the reusable workflow it publishes, built from this commit, so
# the code under review judges each close.
on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  # The called job's reason guard and per-issue concurrency apply here too, so
  # a dropped close still starts no runner.
  close-check:
    uses: ./.github/workflows/close-check-reusable.yml
    with:
      ref: ${{ github.sha }}
