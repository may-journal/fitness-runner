name: Auto-merge
# Runs in every may-journal repo as a required workflow, from the org ruleset
# in may-journal/.github (rulesets/auto-merge-workflow.json). It lives here
# because this repo is public: public repos cannot run a private repo's
# workflows, and private repos can run a public one's. It turns on squash
# auto-merge for each ready pull request, so it merges once approved and
# green. It uses the bot's AUTO_MERGE_TOKEN: GitHub starts no workflows from
# GITHUB_TOKEN pushes, so merging with it would skip CI on main.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  auto-merge:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTO_MERGE_TOKEN is not available to this repo"
            exit 1
          fi
          gh pr merge --auto --squash "$PR_URL"
