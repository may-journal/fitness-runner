name: Auto-merge
# Runs in every may-journal repo as a required workflow, from the org ruleset
# in may-journal/.github (rulesets/auto-merge-workflow.json). It lives here
# because this repo is public: public repos cannot run a private repo's
# workflows, and private repos can run a public one's. It turns on squash
# auto-merge for each ready pull request, so it merges once approved and
# green. It acts as the may-journal-automation GitHub App, so the timeline
# names automation rather than a person or Claude's bot. GitHub starts no
# workflows from GITHUB_TOKEN pushes, so an App token keeps CI running on main.
#
# The ruleset starts it only on opened, reopened, and synchronize, whatever
# types are listed. GitHub refuses auto-merge on a draft, so a draft marked
# ready needs the auto-merge-on-ready.yml caller, which calls this workflow.
# The org's copy of that caller also calls it when a PR's base changes.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_call:

permissions:
  contents: read

jobs:
  auto-merge:
    # Only an open, ready PR without auto-merge yet needs it turned on, so
    # every other push skips before a runner starts and bills nothing.
    # Closing a PR turns its auto-merge off, so a reopen always runs.
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      (github.event.action == 'reopened' || github.event.pull_request.auto_merge == null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pushes come in bursts; one run turns auto-merge on. The workflow name
    # keeps the ruleset's run and the on-ready caller's apart.
    concurrency:
      group: auto-merge-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check the App secrets
        id: report-step-1
        env:
          APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
          APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
        run: |
          for name in APP_ID APP_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::AUTOMATION_${name} is not available to this repo"
              printf 'FITNESS_FAILURE_REPORTED=true\n' >> "$GITHUB_ENV"
              exit 1
            fi
          done
      - name: Mint a one-hour App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      # GitHub refuses auto-merge on a stacked PR: one based on another PR's
      # branch, or one GitHub still counts as part of a stack. Such a PR
      # passes and gets one comment, the note, saying why it has no
      # auto-merge and how to merge it. Once GitHub moves the PR onto the
      # default branch, the next run turns auto-merge on and edits the note
      # to say so. Any other refusal fails the job with GitHub's answer. It
      # reads the event file, as a test can.
      - name: Enable squash auto-merge
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          url="$(jq -r .pull_request.html_url "$GITHUB_EVENT_PATH")"
          number="$(jq -r .pull_request.number "$GITHUB_EVENT_PATH")"
          base="$(jq -r .pull_request.base.ref "$GITHUB_EVENT_PATH")"
          default="$(jq -r .repository.default_branch "$GITHUB_EVENT_PATH")"
          issues="repos/$GITHUB_REPOSITORY/issues"
          marker='<!-- fitness:auto-merge -->'
          # note prints the id of the bot's note on this PR, or nothing.
          note() {
            local ids
            ids="$(gh api "$issues/$number/comments" --paginate --jq ".[] | select(.user.login == \"$BOT\" and (.body | contains(\"$marker\"))) | .id")"
            printf '%s' "${ids%%$'\n'*}"
          }
          # say posts the note, or edits it when its text changed.
          say() {
            local id body="$1"$'\n\n'"$marker"
            id="$(note)"
            if [ -z "$id" ]; then
              gh api "$issues/$number/comments" -f body="$body" > /dev/null
            elif [ "$(gh api "$issues/comments/$id" --jq .body)" != "$body" ]; then
              gh api -X PATCH "$issues/comments/$id" -f body="$body" > /dev/null
            fi
          }
          if [ "$base" != "$default" ]; then
            echo "::notice::This PR targets $base, not $default, so it gets no auto-merge; GitHub has none for stacks. Its auto-merge comment says how to merge it."
            say "Auto-merge is off: this PR targets \`$base\`, not \`$default\`, and GitHub has no auto-merge for stacked pull requests. Merge it by hand once it is approved and green, or merge its base PR first. Once GitHub moves this PR onto \`$default\`, auto-merge turns on and this comment says so."
            exit 0
          fi
          status=0
          answer="$(gh pr merge --auto --squash "$url" 2>&1)" || status=$?
          if [ -n "$answer" ]; then printf '%s\n' "$answer"; fi
          if [ "$status" -eq 0 ]; then
            if [ -n "$(note)" ]; then
              say "Auto-merge is on: this PR now targets \`$default\`, so it squash-merges once it is approved and green."
            fi
            exit 0
          fi
          if grep -qi 'auto-merge is not supported for stacked' <<< "$answer"; then
            echo "::notice::GitHub still counts this PR as stacked, so it gets no auto-merge. Its auto-merge comment says how to merge it."
            say "Auto-merge is off: this PR targets \`$default\`, but GitHub still counts it as part of a stack and refuses auto-merge. Merge it by hand once it is approved and green, or push to it once GitHub moves it out of the stack."
            exit 0
          fi
          answer="${answer//'%'/%25}"
          echo "::error::GitHub refused auto-merge for this PR: ${answer//$'\n'/%0A}"
          printf 'FITNESS_FAILURE_REPORTED=true\n' >> "$GITHUB_ENV"
          exit "$status"
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
          REPORT_ALREADY_ANNOTATED: ${{ env.FITNESS_FAILURE_REPORTED == 'true' && (steps.report-step-1.outcome == 'failure' || steps.merge.outcome == 'failure') }}
        run: |
          if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
