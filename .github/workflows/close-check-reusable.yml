name: Close check (reusable)

# Reusable across the org: a consumer repo calls this from an `issues: closed`
# caller. It installs the published fitness checks and runs `fitness
# close-check`, which reopens an issue closed as completed while its checklist
# still has unchecked items, and comments once naming them. Issue events cannot
# run as org required workflows, so every repo with Issues needs the caller.
# fitness-runner keeps its own build-from-source close-check to test unreleased
# changes.
on:
  workflow_call:
    inputs:
      ref:
        description: fitness-runner version to install (a tag, or main)
        type: string
        default: main

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install the fitness checks
        env:
          # Resolve the ref against GitHub, not proxy.golang.org, which caches
          # what @main points to and can serve a build from before the latest merge.
          GOPROXY: direct
        run: |
          go install "github.com/may-journal/fitness-runner/go/cmd/...@${{ inputs.ref }}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Reopen the issue if it closed with unchecked items
        run: fitness close-check
        env:
          GH_TOKEN: ${{ github.token }}
