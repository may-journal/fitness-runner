name: Close check (reusable)

# Reusable across the org: a consumer repo calls this from an `issues: closed`
# caller. It installs the published fitness checks and runs `fitness
# close-check`, which reopens an issue closed as completed while its checklist
# still has unchecked items, and comments once naming them. Issue events cannot
# run as org required workflows, so every repo with Issues needs the caller.
# fitness-runner keeps its own build-from-source close-check to test unreleased
# changes.
on:
  workflow_call:
    inputs:
      ref:
        description: Optional source ref to compile; empty uses the pinned binary release.
        type: string
        default: ''

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        if: ${{ inputs.ref != '' }}
        with:
          go-version: stable
          cache: false
      - name: Install the pinned fitness bundle
        if: ${{ inputs.ref == '' }}
        uses: may-journal/fitness-runner@go/v0.20261004.900
        with:
          install-only: 'true'
      - name: Build an explicitly requested source ref
        if: ${{ inputs.ref != '' }}
        env:
          GOPROXY: direct
          FITNESS_SOURCE_REF: ${{ inputs.ref }}
        run: |
          go install "github.com/may-journal/fitness-runner/go/cmd/...@$FITNESS_SOURCE_REF"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Reopen the issue if it closed with unchecked items
        run: fitness close-check
        env:
          GH_TOKEN: ${{ github.token }}
