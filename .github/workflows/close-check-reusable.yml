name: Close check (reusable)

# Each org repo with Issues needs an `issues: closed` caller for this, since
# issue events cannot run as org required workflows. It runs the published
# `fitness close-check`, which reopens an issue closed with unchecked items and
# closes a parent once its last child closes.
on:
  workflow_call:
    inputs:
      ref:
        description: Optional source ref to compile; empty uses the pinned binary release.
        type: string
        default: ''

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-check:
    # Dropped work may stay unfinished, so a not planned or duplicate close
    # skips before a runner starts, as fitness close-check does.
    if: ${{ !contains(fromJSON('["not_planned", "duplicate"]'), github.event.issue.state_reason) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    # A close that comes again supersedes the run judging the earlier one.
    concurrency:
      group: close-check-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Reopen the issue if it closed with unchecked items
        uses: $/.github/actions/fitness-command
        with:
          command: close-check
          ref: ${{ inputs.ref }}
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "${{ job.status }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
