# cspell:ignore slurpfile
name: Release approve
# A machine user's APPROVER_TOKEN approves a green release PR or dev bump, since
# a bot cannot approve its own PR. The rules are in
# https://github.com/may-journal/fitness-runner/blob/main/docs/requirements/0093-github-release-approve.md
# and every other PR is left for a person.
on:
  workflow_call:
    inputs:
      pr:
        description: The PR's number.
        required: true
        type: string
      kind:
        description: release for a Release Please PR, dependency for a dev-dependency bump.
        required: false
        default: release
        type: string
    secrets:
      APPROVER_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  approve:
    runs-on: ubuntu-24.04-arm
    # The run's own token reads the PR, its files, contents and checks, so
    # the approver's token needs only pull request access. A caller grants
    # these to the calling job.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    # Checks may take a while; the wait below gives up after 20 minutes.
    timeout-minutes: 25
    # A newer run waits for the running one to finish its wait, which then finds
    # the head moved and approves nothing.
    concurrency:
      group: release-approve-${{ inputs.pr }}
      cancel-in-progress: false
    steps:
      # A missing token skips the approval and leaves the PR to a person. An
      # unknown kind or a token GitHub rejects fails here, before the 20-minute
      # wait, and the token's login names the approver's reviews below.
      - name: Check the approver token
        id: secrets
        env:
          TOKEN: ${{ secrets.APPROVER_TOKEN }}
          KIND: ${{ inputs.kind }}
        run: |
          case "$KIND" in
            release | dependency) ;;
            *) echo "::error::Release approve got kind '$KIND'; pass release or dependency."; exit 1 ;;
          esac
          if [ -z "$TOKEN" ]; then
            echo "::notice::APPROVER_TOKEN is not available to this repo, so a person approves the PR."
            exit 0
          fi
          error="$(mktemp)"
          if login="$(GH_TOKEN="$TOKEN" gh api user --jq .login 2> "$error")" &&
            GH_TOKEN="$TOKEN" gh api "repos/$GITHUB_REPOSITORY" --silent 2> "$error"; then
            printf 'ready=true\nlogin=%s\n' "$login" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$(cat "$error")" in
            *"HTTP 401"*) echo "::error::GitHub rejects APPROVER_TOKEN; replace the org secret with a valid token." ;;
            *"HTTP 404"*) echo "::error::APPROVER_TOKEN cannot see $GITHUB_REPOSITORY; give the token access to it." ;;
            *) echo "::error::Could not check APPROVER_TOKEN: $(cat "$error")" ;;
          esac
          exit 1
      # Only the automation App's PR whose files are all release files
      # qualifies. A rename counts both its paths, so nothing moves in.
      - name: Check the release PR
        id: guard
        if: ${{ steps.secrets.outputs.ready == 'true' && inputs.kind == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          AUTHOR: app/may-journal-automation
        run: |
          view="$(gh pr view "$PR" --json author,state,isDraft,headRefOid)"
          author="$(jq -r .author.login <<< "$view")"
          if [ "$author" != "$AUTHOR" ]; then
            echo "::notice::PR #$PR is by $author, not $AUTHOR, so a person approves it."
            exit 0
          fi
          if [ "$(jq -r '.state + " " + (.isDraft | tostring)' <<< "$view")" != "OPEN false" ]; then
            echo "::notice::PR #$PR is not open and ready, so it gets no approval."
            exit 0
          fi
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate |
            jq -rs 'add | .[] | .filename, (.previous_filename // empty)')"
          others="$(grep -vxF -e CHANGELOG.md -e version.txt -e .release-please-manifest.json <<< "$files" || true)"
          if [ -z "$files" ] || [ -n "$others" ]; then
            echo "::notice::PR #$PR changes more than the release files, so a person approves it: ${others//$'\n'/, }"
            exit 0
          fi
          printf 'sha=%s\n' "$(jq -r .headRefOid <<< "$view")" >> "$GITHUB_OUTPUT"
      # A build(deps) PR qualifies when it changes only existing dev packages in
      # package.json and its lockfile. Every version that moves must keep its
      # major number.
      - name: Check the dependency bump
        id: bump
        if: ${{ steps.secrets.outputs.ready == 'true' && inputs.kind == 'dependency' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          view="$(gh pr view "$PR" --json title,state,isDraft,headRefOid,baseRefOid)"
          if [[ "$(jq -r .title <<< "$view")" != 'build(deps)'* ]]; then
            echo "::notice::PR #$PR is not titled build(deps), so a person approves it."
            exit 0
          fi
          if [ "$(jq -r '.state + " " + (.isDraft | tostring)' <<< "$view")" != "OPEN false" ]; then
            echo "::notice::PR #$PR is not open and ready, so it gets no approval."
            exit 0
          fi
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate |
            jq -rs 'add | .[] | .filename, (.previous_filename // empty)')"
          others="$(grep -vxF -e package.json -e package-lock.json <<< "$files" || true)"
          if [ -z "$files" ] || [ -n "$others" ]; then
            echo "::notice::PR #$PR changes more than package.json and package-lock.json, so a person approves it: ${others//$'\n'/, }"
            exit 0
          fi
          # The base side is the merge base, as the file list is. A file
          # missing on one side reads as {}; any other error fails.
          head="$(jq -r .headRefOid <<< "$view")"
          base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$(jq -r .baseRefOid <<< "$view")...$head" --jq .merge_base_commit.sha)"
          dir="$(mktemp -d)"
          for side in base head; do
            sha="${!side}"
            for file in package.json package-lock.json; do
              if ! gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/$file?ref=$sha" \
                > "$dir/$side-$file" 2> "$dir/error"; then
                if ! grep -q 'HTTP 404' "$dir/error"; then
                  echo "::error::Could not read $file at $sha: $(cat "$dir/error")"
                  exit 1
                fi
                echo '{}' > "$dir/$side-$file"
              fi
            done
          done
          problems="$(jq -rn --slurpfile bm "$dir/base-package.json" --slurpfile hm "$dir/head-package.json" \
            --slurpfile bl "$dir/base-package-lock.json" --slurpfile hl "$dir/head-package-lock.json" '
            # A 0.x version breaks on a minor bump, as semver allows.
            def line: if type == "string" and test("^[^0-9]*[0-9]+")
              then capture("^[^0-9]*(?<major>[0-9]+)(\\.(?<minor>[0-9]+))?") | if .major == "0" then "0.\(.minor)" else .major end
              else null end;
            def header: if has("packages") then del(.packages, .dependencies) else . end;
            def bump($name; $from; $to):
              if ($from | line) == null or ($from | line) != ($to | line)
              then "\($name) moves from \($from) to \($to), not a patch or minor bump" else empty end;
            $bm[0] as $b | $hm[0] as $h | ($b.devDependencies // {}) as $bd | ($h.devDependencies // {}) as $hd |
            ($bl[0].packages // {}) as $bp | ($hl[0].packages // {}) as $hp |
            (if ($b | del(.devDependencies)) != ($h | del(.devDependencies)) then "package.json changes more than devDependencies" else empty end),
            (if ($bd | keys) != ($hd | keys) then "package.json adds or removes a dev dependency" else empty end),
            ($bd | to_entries[] | select(.key as $k | $hd | has($k)) | select(.value != $hd[.key]) | bump(.key; .value; $hd[.key])),
            (if ($bl[0] | header) != ($hl[0] | header) then "package-lock.json changes more than its packages" else empty end),
            (if ($bp[""] | del(.devDependencies)) != ($hp[""] | del(.devDependencies)) then "package-lock.json changes the root package" else empty end),
            (($bp + $hp) | keys[] | select(. != "") | . as $k | select($bp[$k] != $hp[$k]) |
              if [$bp[$k], $hp[$k]] | map(select(. != null)) | all(.dev == true) | not then "\($k) is not a dev-only package"
              elif $hp[$k] != null and ($hp[$k].resolved // "https://registry.npmjs.org/" | startswith("https://registry.npmjs.org/") | not) then "\($k) resolves outside the npm registry"
              elif $bp[$k] != null and $hp[$k] != null and $bp[$k].version == $hp[$k].version then "\($k) changes without a new version"
              elif $bp[$k] != null and $hp[$k] != null then bump($k; $bp[$k].version; $hp[$k].version)
              else empty end)')"
          if [ -n "$problems" ]; then
            echo "::notice::PR #$PR is not a patch or minor dev-dependency bump, so a person approves it: ${problems//$'\n'/; }"
            exit 0
          fi
          printf 'sha=%s\n' "$head" >> "$GITHUB_OUTPUT"
      # Every check but this run's own, known by its run link, must pass. A
      # red or cancelled check, a new push, or checks still running after the
      # last try leave the PR for a person.
      - name: Wait for green checks
        id: checks
        if: ${{ steps.guard.outputs.sha != '' || steps.bump.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SHA: ${{ steps.guard.outputs.sha || steps.bump.outputs.sha }}
          TRIES: 40
          WAIT_SECONDS: 30
        run: |
          verdict=pending
          error="$(mktemp)"
          own="/actions/runs/$GITHUB_RUN_ID/"
          for ((try = 1; try <= TRIES; try++)); do
            if [ "$try" -gt 1 ]; then sleep "$WAIT_SECONDS"; fi
            # gh exits 1 on a failed check and 8 on a pending one, and
            # prints the list either way.
            checks="$(gh pr checks "$PR" --json bucket,link 2> "$error")" || true
            if ! jq -e 'type == "array"' <<< "$checks" > /dev/null 2>&1; then
              if grep -q 'no checks reported' "$error"; then continue; fi
              echo "::error::Could not read the checks of PR #$PR: $(cat "$error")"
              exit 1
            fi
            verdict="$(jq -r --arg own "$own" '[.[] | select((.link // "") | contains($own) | not) | .bucket] |
              if any(. == "fail" or . == "cancel") then "red"
              elif length == 0 or any(. == "pending") then "pending" else "green" end' <<< "$checks")"
            if [ "$verdict" != pending ]; then break; fi
          done
          case "$verdict" in
            red)
              echo "::notice::PR #$PR has a failed or cancelled check, so it gets no approval."
              exit 0 ;;
            pending)
              echo "::warning::PR #$PR still had checks running after $TRIES tries, so a person approves it."
              exit 0 ;;
          esac
          head="$(gh pr view "$PR" --json headRefOid --jq .headRefOid)"
          if [ "$head" != "$SHA" ]; then
            echo "::notice::PR #$PR moved to $head while its checks ran, so this run approves nothing."
            exit 0
          fi
          echo "green=true" >> "$GITHUB_OUTPUT"
      # The approval names the commit checked, so a later push needs a new
      # one. A PR the approver already approved at that commit is left alone.
      - name: Approve the PR
        id: report-step-1
        if: ${{ steps.checks.outputs.green == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.APPROVER_TOKEN }}
          PR: ${{ inputs.pr }}
          SHA: ${{ steps.guard.outputs.sha || steps.bump.outputs.sha }}
          BOT: ${{ steps.secrets.outputs.login }}
        run: |
          reviews="repos/$GITHUB_REPOSITORY/pulls/$PR/reviews"
          approved="$(gh api "$reviews" --paginate |
            jq -rs --arg bot "$BOT" --arg sha "$SHA" 'add | any(.user.login == $bot and .commit_id == $sha and .state == "APPROVED")')"
          if [ "$approved" = true ]; then
            echo "PR #$PR is already approved at $SHA."
            exit 0
          fi
          gh api -X POST "$reviews" -f event=APPROVE -f commit_id="$SHA" \
            -f body="Approved: this PR changes only what Release approve allows for its kind, and its checks are green." > /dev/null
          echo "Approved PR #$PR at $SHA."
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
        run: |
          if [ "$REPORT_STATUS" = failure ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
