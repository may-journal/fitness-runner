name: Release Please (reusable)
# Org repos that release call this public workflow on pushes to main, each with
# its own Release Please config, manifest and version.txt.
# Release Please keeps a release PR open, and merging it tags vX.Y.Z,
# publishes the release and moves vX to it.
on:
  workflow_call:
    secrets:
      AUTOMATION_APP_ID:
        required: true
      AUTOMATION_APP_KEY:
        required: true
      # The approver, a machine user, approves green release PRs.
      APPROVER_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      pr: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
    # One release run at a time per repo. The group name differs from any
    # caller's, since a caller and its called workflow sharing one deadlocks.
    concurrency:
      group: release-please-reusable
      cancel-in-progress: false
    steps:
      - name: Check the App secrets
        id: report-step-1
        env:
          APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
          APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
        run: |
          for name in APP_ID APP_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::AUTOMATION_${name} is not available to this repo"
              printf 'FITNESS_FAILURE_REPORTED=true\n' >> "$GITHUB_ENV"
              exit 1
            fi
          done
      - name: Mint the automation App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      - name: Prepare or publish the release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # pr-check wants plain bullets under "## Changelog" with no bold scopes.
      # This step demotes the headings Release Please writes and strips its
      # bold.
      - name: Shape the release PR notes
        id: shape
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: |
          body="$(gh pr view "$PR" --json body --jq .body)"
          shaped="$(printf '%s\n' "$body" | awk '
            after && first { first = 0; if ($0 != "") print "" }
            { line = $0 }
            after { sub(/^## /, "### ", line); while (sub(/\*\*/, "", line)) {} }
            { print line }
            $0 == "## Changelog" { after = 1; first = 1 }')"
          if [ "$shaped" != "$body" ]; then
            gh pr edit "$PR" --body "$shaped"
            echo "edited=true" >> "$GITHUB_OUTPUT"
          fi
      # pr-check needs every PR to close an issue, so the release PR closes
      # one tracking issue, found by title on each rewrite.
      - name: Link the release PR to its tracking issue
        id: link
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        # pipefail, so a failed lookup stops the step rather than opening a
        # second tracking issue. The title search finds the issue however
        # many others the repo holds; jq keeps only an exact match.
        run: |
          set -o pipefail
          title="Publish the release from PR #$PR"
          issue="$(gh issue list --state all --search "\"$title\" in:title" --json number,title |
            jq -r --arg t "$title" 'map(select(.title == $t))[0].number // empty')"
          if [ -z "$issue" ]; then
            url="$(gh issue create --title "$title" --body "Release Please owns the version and notes in #$PR.")"
            issue="${url##*/}"
          fi
          body="$(gh pr view "$PR" --json body --jq .body)"
          case "$body" in
            *"Closes #$issue."*) ;;
            *) gh pr edit "$PR" --body "$body

          Closes #$issue."
               echo "edited=true" >> "$GITHUB_OUTPUT" ;;
          esac
      # pr-check skips body edits, so it judged the body Release Please first
      # wrote. Reopening the PR after a rewrite lets the check read the shaped
      # body.
      - name: Rerun pr-check on the shaped body
        if: ${{ steps.release.outputs.pr != '' && (steps.shape.outputs.edited == 'true' || steps.link.outputs.edited == 'true') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: |
          gh pr close "$PR"
          gh pr reopen "$PR"
      # Only a missing tag is created; any other lookup error fails the step
      # by name instead of a confusing "Reference already exists".
      - name: Move the major version tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MAJOR: v${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          refs="repos/$GITHUB_REPOSITORY/git/refs"
          if found="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$MAJOR" --silent 2>&1)"; then
            gh api -X PATCH "$refs/tags/$MAJOR" -f sha="$SHA" -F force=true --silent
          elif [[ "$found" == *"Not Found"* ]]; then
            gh api -X POST "$refs" -f ref="refs/tags/$MAJOR" -f sha="$SHA" --silent
          else
            echo "::error::Could not read tag $MAJOR: $found"
            exit 1
          fi
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
          REPORT_ALREADY_ANNOTATED: ${{ env.FITNESS_FAILURE_REPORTED == 'true' && (steps.report-step-1.outcome == 'failure') }}
        run: |
          if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  # The approver approves the release PR once its checks are green, reading
  # them with the run token. `$/` names this repo at the running commit, as
  # https://github.blog/changelog/2026-07-30-reference-same-repository-actions-with-self-repository-syntax
  # explains.
  approve:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    uses: $/.github/workflows/release-approve.yml
    with:
      pr: ${{ needs.release-please.outputs.pr }}
    secrets:
      APPROVER_TOKEN: ${{ secrets.APPROVER_TOKEN }}
