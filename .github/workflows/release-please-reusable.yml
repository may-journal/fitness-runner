name: Release Please (reusable)
# Reusable across the org: may-journal/.github syncs a short caller into each
# repo that opts in to releases, which runs on pushes to main and calls this
# with `secrets: inherit`. It lives here because this repo is public: public
# repos cannot call a private repo's workflows. Each caller keeps its own
# release-please-config.json, .release-please-manifest.json and version.txt.
# Release Please keeps a release PR open from conventional commits on main.
# Merging it tags vX.Y.Z, publishes the release, and moves vX to it.
on:
  workflow_call:
    secrets:
      AUTOMATION_APP_ID:
        required: true
      AUTOMATION_APP_KEY:
        required: true

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One release run at a time per repo. The group name differs from any
    # caller's, since a caller and its called workflow sharing one deadlocks.
    concurrency:
      group: release-please-reusable
      cancel-in-progress: false
    steps:
      - name: Check the App secrets
        id: report-step-1
        env:
          APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
          APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
        run: |
          for name in APP_ID APP_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::AUTOMATION_${name} is not available to this repo"
              printf 'FITNESS_FAILURE_REPORTED=true\n' >> "$GITHUB_ENV"
              exit 1
            fi
          done
      - name: Mint the automation App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      - name: Prepare or publish the release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # pr-check wants plain bullets under "## Changelog" and no bold scopes.
      # Release Please writes a "## 1.0.0" heading on a first release, which
      # has no compare link, and bold scopes. Demote the headings below the
      # header and strip the bold.
      - name: Shape the release PR notes
        id: shape
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: |
          body="$(gh pr view "$PR" --json body --jq .body)"
          shaped="$(printf '%s\n' "$body" | awk '
            after && first { first = 0; if ($0 != "") print "" }
            { line = $0 }
            after { sub(/^## /, "### ", line); while (sub(/\*\*/, "", line)) {} }
            { print line }
            $0 == "## Changelog" { after = 1; first = 1 }')"
          if [ "$shaped" != "$body" ]; then
            gh pr edit "$PR" --body "$shaped"
            echo "edited=true" >> "$GITHUB_OUTPUT"
          fi
      # pr-check needs every PR to close an issue, so the release PR closes
      # one tracking issue, found by title on each rewrite.
      - name: Link the release PR to its tracking issue
        id: link
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: |
          title="Publish the release from PR #$PR"
          issue="$(gh issue list --state all --limit 200 --json number,title |
            jq -r --arg t "$title" 'map(select(.title == $t))[0].number // empty')"
          if [ -z "$issue" ]; then
            url="$(gh issue create --title "$title" --body "Release Please owns the version and notes in #$PR.")"
            issue="${url##*/}"
          fi
          body="$(gh pr view "$PR" --json body --jq .body)"
          case "$body" in
            *"Closes #$issue."*) ;;
            *) gh pr edit "$PR" --body "$body

          Closes #$issue."
               echo "edited=true" >> "$GITHUB_OUTPUT" ;;
          esac
      # pr-check runs when a PR opens or reopens but not when its body is
      # edited, so it judged the body Release Please first wrote. Reopen the PR
      # after a rewrite so the check reads the shaped body.
      - name: Rerun pr-check on the shaped body
        if: ${{ steps.release.outputs.pr != '' && (steps.shape.outputs.edited == 'true' || steps.link.outputs.edited == 'true') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: |
          gh pr close "$PR"
          gh pr reopen "$PR"
      - name: Move the major version tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MAJOR: v${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          refs="repos/$GITHUB_REPOSITORY/git/refs"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$MAJOR" --silent 2>/dev/null; then
            gh api -X PATCH "$refs/tags/$MAJOR" -f sha="$SHA" -F force=true --silent
          else
            gh api -X POST "$refs" -f ref="refs/tags/$MAJOR" -f sha="$SHA" --silent
          fi
      # Bootstrap fallback must work even when checkout or tool setup failed.
      - name: Report job outcome
        if: ${{ always() }}
        shell: bash
        env:
          REPORT_STATUS: ${{ job.status }}
          REPORT_ALREADY_ANNOTATED: ${{ env.FITNESS_FAILURE_REPORTED == 'true' && (steps.report-step-1.outcome == 'failure') }}
        run: |
          if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
            printf '::error::Workflow job %s failed; open its logs for the failed step and cause.\n' "$GITHUB_JOB"
          fi
          printf '### Job %s: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
