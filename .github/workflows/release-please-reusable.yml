name: Release Please (reusable)
# Org repos that release call this public workflow on pushes to main, each with
# its own Release Please config, manifest and version.txt.
# Release Please keeps a release PR open, and merging it tags vX.Y.Z,
# publishes the release and moves its major tag, vX or <component>-vX.
on:
  workflow_call:
    outputs:
      # A JSON array with one {path, tag, major_tag, sha} per released
      # component, empty when nothing was released.
      releases:
        value: ${{ jobs.release-please.outputs.releases }}
    secrets:
      AUTOMATION_APP_ID:
        required: true
      AUTOMATION_APP_KEY:
        required: true
      # The approver, a machine user, approves green release PRs.
      APPROVER_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      pr: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
      releases: ${{ steps.tags.outputs.releases || '[]' }}
    # One release run at a time per repo. The group name differs from any
    # caller's, since a caller and its called workflow sharing one deadlocks.
    concurrency:
      group: release-please-reusable
      cancel-in-progress: false
    steps:
      # `$/` names this repo at the running commit, so the shared action
      # matches this workflow's version.
      - name: Mint the automation App token
        id: app-token
        uses: $/.github/actions/app-token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      - name: Prepare or publish the release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The steps below share the release PR's number and repo from here.
      - name: Name the release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          PR: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: printf 'PR=%s\nGH_REPO=%s\n' "$PR" "$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
      # pr-check wants plain bullets under "## Changelog" with no bold scopes,
      # so this step demotes Release Please's headings and strips the bold.
      # A later release's compare link 404s until the PR merges, so it points
      # at the PR's head commit instead.
      - name: Shape the release PR notes
        id: shape
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        uses: $/.github/actions/fitness-ci
        with:
          command: shape-release-notes
      # pr-check needs every PR to close an issue, so the release PR closes
      # one tracking issue, found by title on each rewrite.
      - name: Link the release PR to its tracking issue
        id: link
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        uses: $/.github/actions/fitness-ci
        with:
          command: link-release-tracking-issue
      # pr-check skips body edits, so it judged the body Release Please first
      # wrote. Reopening the PR after a rewrite lets the check read the shaped
      # body.
      - name: Rerun pr-check on the shaped body
        if: ${{ steps.release.outputs.pr != '' && (steps.shape.outputs.edited == 'true' || steps.link.outputs.edited == 'true') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        uses: $/.github/actions/fitness-ci
        with:
          command: reopen-pr
      # Only a missing tag is created; any other lookup error fails the step
      # by name instead of a confusing "Reference already exists".
      # Each released component moves its own major tag, v1 for the root and
      # <component>-v1 for a component, reading outputs prefixed by its path.
      - name: Move the major version tag
        id: tags
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        uses: $/.github/actions/fitness-ci
        with:
          command: move-major-tag
      - name: Report job outcome
        if: ${{ always() }}
        run: printf '### Job %s (%s)\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$GITHUB_JOB" "${{ job.status }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  # The approver approves the release PR once its checks are green, reading
  # them with the run token. `$/` names this repo at the running commit, as
  # https://github.blog/changelog/2026-07-30-reference-same-repository-actions-with-self-repository-syntax
  # explains.
  approve:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    uses: $/.github/workflows/release-approve.yml
    with:
      pr: ${{ needs.release-please.outputs.pr }}
    secrets:
      APPROVER_TOKEN: ${{ secrets.APPROVER_TOKEN }}
