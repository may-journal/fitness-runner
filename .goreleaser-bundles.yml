# cspell:ignore trimpath
version: 2
project_name: fitness
snapshot:
  version_template: '{{ .Env.FITNESS_VERSION }}'
changelog:
  disable: true
# Each skill sits beside its command's code; this gathers them into
# out/skills/<name>/ so the archive ships one flat skills folder.
before:
  hooks:
    - go -C go run ./cmd/fitness-release skills --root ..
dist: out/bundles
builds:
  - id: fitness
    dir: go
    main: ./cmd/fitness
    binary: fitness
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath, -buildvcs=false]
    ldflags: [-s -w]
archives:
  - id: bundle
    ids: [fitness]
    formats: [tar.gz]
    name_template: 'fitness-{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    wrap_in_directory: true
    files:
      - src: out/skills/**/*
        dst: skills
checksum:
  name_template: checksums.txt
