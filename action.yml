name: Fitness
description: Run a pinned, verified Fitness binary bundle without compiling it.
inputs:
  version:
    description: Exact bundle version. Empty uses the installer pin; latest is explicit opt-in.
    default: ''
  check:
    description: Optional single check; empty runs the configured suite.
    default: ''
  policy:
    description: Explicit org or external policy; empty uses repo config.
    default: ''
  checks:
    description: Optional comma-separated filter; external policy runs all checks by default.
    default: ''
  install-only:
    description: Install the bundle and add it to PATH without running checks.
    default: 'false'
outputs:
  bin:
    description: Directory containing the runner and every check.
    value: ${{ steps.install.outputs.bin }}
runs:
  using: composite
  steps:
    - name: Download the compiled Go installer
      id: download
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        RELEASE_URL: https://github.com/may-journal/fitness-runner/releases/download/go/v0.20261004.1140
        REQUESTED_VERSION: ${{ inputs.version }}
        PLATFORM: ${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'darwin' || 'unsupported' }}-${{ runner.arch == 'ARM64' && 'arm64' || runner.arch == 'X64' && 'amd64' || 'unsupported' }}
      run: |
        printf 'FITNESS_FAILURE_REPORTED=false\n' >> "$GITHUB_ENV"
        if [ -n "$REQUESTED_VERSION" ] && [ "$REQUESTED_VERSION" != latest ]; then
          REQUESTED_VERSION="${REQUESTED_VERSION#go/}"
          REQUESTED_VERSION="${REQUESTED_VERSION#v}"
          if [[ ! "$REQUESTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf '::error::Invalid Fitness version; use numeric major.minor.patch or latest.\n'
            exit 1
          fi
          RELEASE_URL="https://github.com/may-journal/fitness-runner/releases/download/go/v$REQUESTED_VERSION"
        fi
        ASSET="fitness-install-${RELEASE_URL##*/v}-$PLATFORM"
        curl -fsSL --retry 3 "$RELEASE_URL/$ASSET" -o "$ASSET"
        curl -fsSL --retry 3 "$RELEASE_URL/checksums.txt" -o "$ASSET.checksums"
        grep "  $ASSET$" "$ASSET.checksums" | shasum -a 256 -c -
        chmod +x "$ASSET"
        printf 'executable=%s/%s\n' "$PWD" "$ASSET" >> "$GITHUB_OUTPUT"
    - id: install
      shell: bash
      env:
        FITNESS_EXECUTABLE: ${{ steps.download.outputs.executable }}
        FITNESS_VERSION: ${{ inputs.version }}
        FITNESS_CHECK: ${{ inputs.check }}
        FITNESS_POLICY: ${{ inputs.policy }}
        FITNESS_CHECKS: ${{ inputs.checks }}
        FITNESS_INSTALL_ONLY: ${{ inputs.install-only }}
      run: '"$FITNESS_EXECUTABLE" --github-action'
    # Shell builtins also work when a consumer deliberately excludes Go from PATH.
    - name: Report action outcome
      if: ${{ always() }}
      shell: bash
      env:
        REPORT_STATUS: ${{ steps.download.outcome == 'failure' && 'failure' || steps.install.outcome == 'failure' && 'failure' || steps.install.outcome }}
        REPORT_ALREADY_ANNOTATED: ${{ env.FITNESS_FAILURE_REPORTED == 'true' && steps.install.outcome == 'failure' }}
      run: |
        if [ "$REPORT_STATUS" = failure ] && [ "$REPORT_ALREADY_ANNOTATED" != true ]; then
          printf '::error::Fitness installation or execution failed; open the action logs for the failed operation and its cause.\n'
          printf 'FITNESS_FAILURE_REPORTED=true\n' >> "$GITHUB_ENV"
        fi
        printf '### Fitness action: %s\n\n[View steps and logs](%s/%s/actions/runs/%s)\n' "$REPORT_STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
