name: Fitness
description: Run a pinned, verified Fitness binary bundle without compiling it.
inputs:
  version:
    description: Exact release version. Empty uses the action's pin; latest is explicit opt-in.
    default: ''
  check:
    description: Optional single check; empty runs the configured suite.
    default: ''
  install-only:
    description: Install the bundle and add it to PATH without running checks.
    default: 'false'
outputs:
  bin:
    description: Directory containing the runner and every check.
    value: ${{ steps.install.outputs.bin }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        FITNESS_ACTION_PATH: ${{ github.action_path }}
        FITNESS_VERSION: ${{ inputs.version }}
      run: |
        args=(--install-only)
        if [ -n "$FITNESS_VERSION" ]; then args+=(--version "$FITNESS_VERSION"); fi
        bin=$(bash "$FITNESS_ACTION_PATH/fitness.sh" "${args[@]}")
        echo "$bin" >> "$GITHUB_PATH"
        echo "bin=$bin" >> "$GITHUB_OUTPUT"
    - if: inputs.install-only != 'true'
      shell: bash
      env:
        FITNESS_BIN: ${{ steps.install.outputs.bin }}
        FITNESS_CHECK: ${{ inputs.check }}
      run: |
        args=()
        if [ -n "$FITNESS_CHECK" ]; then args+=("--check=$FITNESS_CHECK"); fi
        "$FITNESS_BIN/fitness" "${args[@]}"
